:root[data-theme="dark"]{

.opt.wrong{border:3px solid var(--bad);background:var(--bad-soft);opacity:1}

.tools label{display:flex;gap:10px;align-items:center;min-height:46px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--pri);flex:none}
.hint{background:var(--pri-soft);border-radius:12px;padding:10px 14px}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--leaf-soft)} .fb.no{background:var(--bad-soft)}
.src{font-size:13px;color:var(--muted)}
.map .center{justify-self:center;font-family:var(--f-display);font-size:22px;padding:8px 18px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.map{display:grid;gap:12px}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.branch{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.blank{border:0;background:var(--sun-soft);border-radius:10px;padding:10px;text-align:left;min-height:46px}
.blank.shown{background:var(--leaf-soft)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;min-height:48px;font-size:17px}
.chip.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.chip.sel,.chip.picked{border-color:var(--sun);background:var(--sun-soft);color:var(--ink);opacity:1}

.prev{background:var(--card);border-radius:12px;padding:8px 12px;font-size:15px}
.fig{width:100%;height:auto;display:block;border-radius:14px}

.ck{display:flex;gap:10px;align-items:center}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;min-height:46px}

.pot svg{width:100%;max-width:120px;height:auto}
.toggle{display:flex;gap:10px;align-items:center;min-height:46px}

.done b.t{font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--leaf)}
.moods{display:flex;gap:12px}

details{background:var(--card);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow)}

.exits{display:grid;gap:16px;margin:0;padding-left:22px}

.three div{background:var(--bg);border-radius:12px;padding:10px;display:grid;gap:2px}

// 太陽位置（NOAA 簡化公式）：給日期、當地時間（小時，可帶小數）、緯度、經度、時區，
// 回傳 {alt: 高度角°, az: 方位角°（正北為 0，順時針）}。影子實驗室用台中（24.15N, 120.68E, UTC+8）。
// 精度約 ±0.5°，對五年級的「方位＋高度角」教學足夠；日出日落用 alt=0 求。
function sunPosition(date, hour, lat, lon, tz) {
  var rad = Math.PI / 180;
  var start = Date.UTC(date.getFullYear(), 0, 1);
  var today = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
  var n = Math.round((today - start) / 86400000) + 1;
  var g = 2 * Math.PI / 365 * (n - 1 + (hour - 12) / 24);
  var eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
    - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g)
    + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  var tst = hour * 60 + eqt + 4 * lon - 60 * tz;
  var ha = (tst / 4 - 180) * rad;
  var phi = lat * rad;
  var cosZ = Math.sin(phi) * Math.sin(decl) + Math.cos(phi) * Math.cos(decl) * Math.cos(ha);
  var zen = Math.acos(Math.max(-1, Math.min(1, cosZ)));
  var az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(phi) - Math.tan(decl) * Math.cos(phi)) / rad + 180;
  return { alt: 90 - zen / rad, az: (az + 360) % 360 };
}
// 日出、日落（當地時間，小時）：以 1 分鐘步進找高度角過 0 的時刻
function sunTimes(date, lat, lon, tz) {
  var rise = null, set = null, prev = sunPosition(date, 4, lat, lon, tz).alt;
  for (var m = 4 * 60 + 1; m <= 20 * 60; m++) {
    var a = sunPosition(date, m / 60, lat, lon, tz).alt;
    if (prev <= 0 && a > 0 && rise === null) rise = m / 60;
    if (prev > 0 && a <= 0) set = m / 60;
    prev = a;
  }
  return { rise: rise, set: set };
}
if (typeof module !== "undefined") module.exports = { sunPosition: sunPosition, sunTimes: sunTimes };

    if (!isObj(c)) return false;
    if (!isStr(c.id) || !isStr(c.q) || !Object.prototype.hasOwnProperty.call(bank.concepts, c.concept)) return false;
    if (c.type === "choice" || c.type === "figure") {
      if (c.type === "figure" && !Object.prototype.hasOwnProperty.call(bank.figs, c.fig)) return false;
      return Array.isArray(c.opts) && c.opts.length >= 2 && c.opts.every(isStr) && Number.isInteger(c.a) && c.a >= 0 && c.a < c.opts.length;
    }
    if (c.type === "recall") return isStr(c.ans);
    if (c.type === "map") return isStr(c.center) && Array.isArray(c.branches) && c.branches.length > 0 &&
      c.branches.every(function (b) { return isObj(b) && isStr(b.k) && isStr(b.show) && isStr(b.blank); });
    return false;
  }
  function allCards(state, bank) { return bank.cards.concat(state.extra); }
  function cardById(state, bank, id) {
    var a = allCards(state, bank);
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }
  function conceptOn(state, bank, cid) { return bank.concepts[cid].unit !== "3" || state.settings.unit3; }
  function enabledCards(state, bank) {
    return allCards(state, bank).filter(function (c) { return conceptOn(state, bank, c.concept); });
  }
  function cardState(state, id) { return state.cards[id] || { seen: 0, goodDays: [], blockedDay: null, due: null }; }
  function retired(cs) { return cs.goodDays.length >= 3; }

  /* ---------- 空白狀態 ---------- */
  function blankState() {
    return { v: 3, cards: {}, exits: {}, days: {}, labRuns: {}, session: null, log: [], ops: [],
             help: {}, extra: [], settings: { unit3: false, sound: true } };
  }
  function blankDay() { return { planIds: [], doneIds: [], touched: [], extraDone: false, labRuns: 0, teach: 0, mood: null }; }

  /* ---------- 每日計畫 ---------- */
  function newQuota(day) { return day < DIAG_END ? NEW_PER_DAY_DIAG : NEW_PER_DAY; }
  function computePlan(state, bank, day) {
    var cards = enabledCards(state, bank), due = [], fresh = [];
    cards.forEach(function (c) {
      var cs = cardState(state, c.id);
      if (cs.seen > 0) { if (!retired(cs) && cs.due && cs.due <= day) due.push(c.id); }
      else fresh.push(c.id);
    });
    var pick = {}; due.concat(fresh.slice(0, newQuota(day))).forEach(function (id) { pick[id] = 1; });
    return cards.filter(function (c) { return pick[c.id]; }).map(function (c) { return c.id; });   // 固定題庫順序
  }
  // 每日第一次操作就把當天計畫固定下來；之後匯入、開放單元都等隔天才納入（矩陣 29）
  function ensureDay(state, bank, day) {
    if (!state.days[day]) { var d = blankDay(); d.planIds = computePlan(state, bank, day); state.days[day] = d; }
    return state.days[day];
  }
  function dayCompleted(d) {
    return !!d && d.planIds.length > 0 && d.planIds.every(function (id) { return d.doneIds.indexOf(id) >= 0; });
  }
  function remainingOf(d) { return d.planIds.filter(function (id) { return d.doneIds.indexOf(id) < 0; }); }

  // 三單元交錯期：同一份計畫，改成輪流出不同概念（不隨機，重載後順序不變）
  function sessionOrder(state, bank, day, ids) {
    if (day < MIX_START) return ids.slice();
    var by = {}, order = [];
    ids.forEach(function (id) { var c = cardById(state, bank, id), k = c ? c.concept : "?"; if (!by[k]) { by[k] = []; order.push(k); } by[k].push(id); });
    var out = [];
    while (out.length < ids.length) order.forEach(function (k) { if (by[k].length) out.push(by[k].shift()); });
    return out;
  }
  function planSession(state, bank, day) {
    var d = ensureDay(state, bank, day);
    var q = sessionOrder(state, bank, day, remainingOf(d));
    // 待協助的概念排到這一輪最後：先別再刷她卡住的觀念（補救分支三）
    var stuck = function (id) { var c = cardById(state, bank, id), h = c && state.help[c.concept]; return h && h.needsHelp ? 1 : 0; };
    q = q.map(function (id, i) { return [stuck(id), i, id]; }).sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; }).map(function (x) { return x[2]; });
    return { day: day, kind: "plan", queue: q, answered: [], wrong: [], kinds: {} };
  }
  // 跨午夜：日期與任務一起切換（矩陣 16、17）
  function syncSession(state, bank, day) {
    if (state.session && state.session.day !== day) state.session = planSession(state, bank, day);
  }

  /* ---------- 出口題 ---------- */
  function openExit(state, cid, day) {
    var e = state.exits[cid];
    if (!e) state.exits[cid] = { status: "pending", due: addDays(day, 1), opened: day, last: null };
  }

  /* ---------- reducer ---------- */
  function fail(state, code) { return { state: state, error: code }; }

  function reduce(state0, action, env) {
    var bank = env.bank, today = dayKey(env.now);
    if (!isObj(action) || !isStr(action.type)) return fail(state0, "BAD_ACTION");
    if (action.type !== "tick" && !isStr(action.id)) return fail(state0, "BAD_ACTION");
    if (action.id && state0.ops.indexOf(action.id) >= 0) return { state: state0, dup: true };
    var s = clone(state0), info = {};
    var day = ensureDay(s, bank, today);
    syncSession(s, bank, today);
    var wasDone = dayCompleted(day);
    function extra() { if (wasDone) day.extraDone = true; }   // 只有計畫先完成，之後實際完成的才算加碼（矩陣 9、10、12）

    switch (action.type) {
      case "tick": break;

      case "sessionStart": {
        if (action.kind === "redo") {
          var ids = (Array.isArray(action.ids) ? action.ids : []).filter(function (id) { return !!cardById(s, bank, id); });
          s.session = { day: today, kind: "redo", queue: uniq(ids), answered: [], wrong: [], kinds: {} };
        } else {
          var sess = planSession(s, bank, today);
          if (isStr(action.focus) && bank.concepts[action.focus]) {
            // 概念入口：她選的觀念先練，只換順序、不改到期規則與當日計畫
            var mine = function (id) { var c = cardById(s, bank, id); return c && c.concept === action.focus ? 0 : 1; };
            sess.queue = sess.queue.map(function (id, i) { return [mine(id), i, id]; }).sort(function (x, y) { return x[0] - y[0] || x[1] - y[1]; }).map(function (x) { return x[2]; });
            sess.focus = action.focus;
          }
          if (isNat(action.size) && action.size > 0) sess.queue = sess.queue.slice(0, action.size);
          sess.size = sess.queue.length;
          s.session = sess;
        }
        break;
      }

      case "answer": {
        var card = cardById(s, bank, action.cardId);
        if (!card) return fail(state0, "NO_CARD");
        if (!isBool(action.ok)) return fail(state0, "BAD_ACTION");
        var cs = s.cards[card.id] = clone(cardState(s, card.id));
        var sessKind = s.session && s.session.kinds[card.id];
        var variation = !!action.variation || sessKind === "variation";
        var first = day.touched.indexOf(card.id) < 0;
        var shaky = !action.ok || !!action.hint || !!action.unsure;
        cs.seen++;
        if (cs.needsRecheck) delete cs.needsRecheck;
        if (shaky) {
          // 任何答錯、提示、不確定：清空有效日期，當天不得補回（矩陣 3、4）
          cs.goodDays = []; cs.blockedDay = today; cs.due = addDays(today, 1);
        } else if (first && !variation && cs.blockedDay !== today && cs.goodDays.indexOf(today) < 0) {
          cs.goodDays.push(today);
          var n = cs.goodDays.length;
          cs.due = n === 1 ? addDays(today, 1) : n === 2 ? addDays(today, 2) : null;
          info.graduated = n >= 3;
        } else if (cs.due === null && cs.goodDays.length === 0) {
          cs.due = addDays(today, 1);   // 第一次見到就是變式或重答：至少明天要回來
        }
        if (cs.goodDays.length > 3) cs.goodDays = cs.goodDays.slice(-3);
        if (first) day.touched.push(card.id);
        var inPlan = day.planIds.indexOf(card.id) >= 0;
        if (inPlan && day.doneIds.indexOf(card.id) < 0) day.doneIds.push(card.id);
        if (!inPlan || !first) extra();
        else if (wasDone) extra();
        openExit(s, card.concept, today);
        pushCap(s.log, { op: action.id, d: today, card: card.id, c: card.concept, ok: action.ok,
                         hint: !!action.hint, unsure: !!action.unsure, variation: variation, first: first }, LOG_KEEP);
        if (variation && !action.ok) {
          // 補救後換題仍錯：停止本輪、標「待協助」，交給爸媽陪她看（補救分支三）
          var hh = s.help[card.concept] || (s.help[card.concept] = { count: 0, last: null, way: 0, needsHelp: false });
          hh.needsHelp = true;
          if (s.session) s.session.halted = true;
          info.halted = true;
        }
        if (s.session) {
          var q = s.session.queue, at = q.indexOf(card.id);
          if (at >= 0) q.splice(at, 1);
          if (s.session.answered.indexOf(card.id) < 0) s.session.answered.push(card.id);
          if (!action.ok && s.session.wrong.indexOf(card.id) < 0) s.session.wrong.push(card.id);
          delete s.session.kinds[card.id];
        }
        info.first = first; info.variation = variation;
        break;
      }

      case "exit": {
        var cid = action.cid;
        if (!bank.concepts[cid]) return fail(state0, "NO_CONCEPT");
        if (action.result !== "pass" && action.result !== "fail") return fail(state0, "BAD_ACTION");
        var e = s.exits[cid];
        if (e && e.status === "pass") return fail(state0, "EXIT_CLOSED");   // 通過後只有明確重測才開新票
        e = s.exits[cid] = e || { status: "pending", due: today, opened: today, last: null };
        e.last = today;

        else {
          e.status = "fail"; e.due = addDays(today, 1);

          allCards(s, bank).forEach(function (c) {
            if (c.concept !== cid) return;

            if (!st || st.seen === 0) return;
            st.goodDays = [];
            var tm = addDays(today, 1);
            st.due = st.due && st.due < tm ? st.due : tm;
          });
        }
        break;
      }

      case "exitRetest": {
        if (!bank.concepts[action.cid]) return fail(state0, "NO_CONCEPT");
        var ex = s.exits[action.cid];
        if (ex && ex.status !== "pass") return fail(state0, "EXIT_OPEN");
        s.exits[action.cid] = { status: "pending", due: today, opened: today, last: ex ? ex.last : null };
        break;
      }

      case "labStart": {
        if (!isStr(action.runId) || !isStr(action.lab) || !isNat(action.tasks) || action.tasks < 1 || !isNat(action.answer))
          return fail(state0, "BAD_ACTION");
        if (s.labRuns[action.runId]) return fail(state0, "RUN_EXISTS");
        s.labRuns[action.runId] = { lab: action.lab, day: today, phase: "predict", prediction: null, predictionCorrect: null,
                                    answer: action.answer, tasks: action.tasks, tasksDone: [],
                                    from: action.from === "wrong" ? "wrong" : "menu", card: isStr(action.card) ? action.card : null };
        var keys = Object.keys(s.labRuns);
        if (keys.length > RUNS_KEEP) keys.slice(0, keys.length - RUNS_KEEP).forEach(function (k) { delete s.labRuns[k]; });
        break;
      }
      case "labPredict": {
        var r = s.labRuns[action.runId];
        if (!r) return fail(state0, "NO_RUN");
        if (r.phase !== "predict") return fail(state0, "ALREADY_PREDICTED");
        if (!isNat(action.choice)) return fail(state0, "BAD_ACTION");
        r.prediction = action.choice; r.predictionCorrect = action.choice === r.answer; r.phase = "observe";
        break;
      }
      case "labTask": {
        var r2 = s.labRuns[action.runId];
        if (!r2) return fail(state0, "NO_RUN");
        if (r2.phase === "predict") return fail(state0, "PREDICTION_REQUIRED");   // 先預測才能操作（矩陣 11）
        if (!isNat(action.task) || action.task >= r2.tasks) return fail(state0, "BAD_ACTION");
        if (r2.tasksDone.indexOf(action.task) < 0) r2.tasksDone.push(action.task);
        break;
      }
      case "labComplete": {
        var r3 = s.labRuns[action.runId];
        if (!r3) return fail(state0, "NO_RUN");
        if (r3.phase === "predict") return fail(state0, "PREDICTION_REQUIRED");
        if (r3.phase === "complete") return { state: state0, dup: true };          // 同一次實驗只算一次（矩陣 6、12）
        if (r3.tasksDone.length < r3.tasks) return fail(state0, "TASKS_LEFT");

      }

      case "help": {

        if (!bank.concepts[action.cid]) return fail(state0, "NO_CONCEPT");
        if (!isNat(action.ways) || action.ways < 1) return fail(state0, "BAD_ACTION");

        info.previous = h0 && h0.count ? { last: h0.last, way: h0.way } : null;
        var h = s.help[action.cid] = h0 ? clone(h0) : { count: 0, last: null, way: 0, needsHelp: false };

        break;
      }

        var hp = s.help[action.cid];

        hp.needsHelp = false;
        break;
      }
      case "teach": {
        if (!cardById(s, bank, action.cardId)) return fail(state0, "NO_CARD");
        day.teach++;
        extra();
        break;
      }
      case "mood": {
        if (["good", "ok", "tired"].indexOf(action.value) < 0) return fail(state0, "BAD_ACTION");
        day.mood = action.value;
        break;
      }
      case "settings": {
        if (action.unit3 !== undefined) { if (!isBool(action.unit3)) return fail(state0, "BAD_ACTION"); s.settings.unit3 = action.unit3; }
        if (action.sound !== undefined) { if (!isBool(action.sound)) return fail(state0, "BAD_ACTION"); s.settings.sound = action.sound; }
        break;
      }
      case "import": {
        if (!Array.isArray(action.cards)) return fail(state0, "BAD_ACTION");
        var have = {}; allCards(s, bank).forEach(function (c) { have[c.id] = 1; });
        var acc = [], rej = [];
        action.cards.forEach(function (c) {
          var id = isObj(c) && isStr(c.id) ? c.id : "(無 id)";
          if (have[id] || !validCard(c, bank)) { rej.push(id); return; }
          have[id] = 1; acc.push(id);
          s.extra.push(clone(c));
        });

        break;
      }

  }

  // 變式：同概念、已學、不是原卡；優先已在佇列的（移到前方），否則挑最不熟的（矩陣 6）
  function pickVariation(s, bank, orig, wanted) {
    var cands = enabledCards(s, bank).filter(function (c) {
      return c.concept === orig.concept && c.id !== orig.id && cardState(s, c.id).seen > 0;
    });
    if (!cands.length) return null;
    if (wanted && cands.some(function (c) { return c.id === wanted; })) return wanted;
    var q = s.session ? s.session.queue : [];

    var pool = inQ.length ? inQ : cands;
    pool.sort(function (a, b) { return cardState(s, a.id).goodDays.length - cardState(s, b.id).goodDays.length; });
    return pool[0].id;
  }

  /* ---------- 檢視（純函式，不改狀態） ---------- */
  function view(state, env) {
    var bank = env.bank, today = dayKey(env.now);
    var s = clone(state);
    var d = ensureDay(s, bank, today);
    syncSession(s, bank, today);
    var exitPending = 0, exitLater = 0;
    Object.keys(s.exits).forEach(function (cid) {
      var e = s.exits[cid];
      if (!bank.concepts[cid] || !conceptOn(s, bank, cid) || e.status === "pass") return;
      if (e.due <= today) exitPending++; else exitLater++;
    });
    var stages = {};
    Object.keys(bank.concepts).forEach(function (cid) { stages[cid] = stageOf(s, bank, cid); });
    return {
      today: today, planIds: d.planIds.slice(), doneIds: d.doneIds.slice(), remainingIds: remainingOf(d),
      completed: dayCompleted(d), session: s.session, stages: stages, day: d,
      M: { cardProgress: { done: d.doneIds.length, planned: d.planIds.length }, exitPending: exitPending, extraDone: d.extraDone },
      exitLater: exitLater,
      needsHelp: Object.keys(s.help).filter(function (cid) { return s.help[cid].needsHelp && bank.concepts[cid] && conceptOn(s, bank, cid); })
    };
  }
  // 植物階段完全由狀態派生（矩陣 26）：0 種子＝沒見過；1 發芽＝見過部分；2 長葉＝全部見過；3 開花＝出口題通過；4 結果＝出口通過且全部畢業
  function stageOf(s, bank, cid) {
    var cards = enabledCards(s, bank).filter(function (c) { return c.concept === cid; });
    if (!cards.length) return 0;
    var seen = cards.filter(function (c) { return cardState(s, c.id).seen > 0; }).length;
    var e = s.exits[cid], pass = !!e && e.status === "pass";
    if (pass && cards.every(function (c) { return retired(cardState(s, c.id)); })) return 4;
    if (pass) return 3;
    if (seen === cards.length) return 2;
    return seen ? 1 : 0;
  }
  function endTitle(v) {
    if (!v.planIds.length) return "今天沒有排定卡片";
    if (v.completed) return "今天的卡片都做完了";
    if (v.session && v.session.halted) return "這一輪先停在這裡";
    if (v.session && !v.session.queue.length && v.session.answered.length) return "這一輪完成了";
    return "";
  }
  function exitList(state, env) {
    var bank = env.bank, today = dayKey(env.now);
    return Object.keys(bank.concepts).filter(function (cid) { return state.exits[cid] && conceptOn(state, bank, cid); })
      .map(function (cid) { var e = state.exits[cid]; return { cid: cid, status: e.status, due: e.due, last: e.last, ready: e.status !== "pass" && e.due <= today }; });
  }

  /* ---------- 嚴格 schema（矩陣 19） ---------- */
  function dayList(a) { return Array.isArray(a) && a.every(isDay) && uniq(a).length === a.length; }
  function strList(a) { return Array.isArray(a) && a.every(isStr); }
  function checkState(o, bank) {
    var errs = [];
    function bad(m) { errs.push(m); }
    if (!isObj(o) || o.v !== 3) { bad("v"); return errs; }
    if (!isObj(o.cards)) bad("cards"); else Object.keys(o.cards).forEach(function (k) {
      var c = o.cards[k];
      if (!isObj(c) || !isNat(c.seen) || !dayList(c.goodDays) || c.goodDays.length > 3 ||
          !(c.blockedDay === null || isDay(c.blockedDay)) || !(c.due === null || isDay(c.due)) ||
          (c.needsRecheck !== undefined && c.needsRecheck !== true)) bad("card " + k);
      else if (c.goodDays.length === 3 && c.due !== null) bad("card " + k + " retired with due");
      else if (c.goodDays.slice().sort().join() !== c.goodDays.join()) bad("card " + k + " order");
    });
    if (!isObj(o.exits)) bad("exits"); else Object.keys(o.exits).forEach(function (k) {
      var e = o.exits[k];
      if (!bank.concepts[k] || !isObj(e) || ["pending", "fail", "pass"].indexOf(e.status) < 0 ||
          !(e.due === null || isDay(e.due)) || !isDay(e.opened) || !(e.last === null || isDay(e.last)) ||
          ((e.status === "pass") !== (e.due === null))) bad("exit " + k);
    });
    if (!isObj(o.days)) bad("days"); else Object.keys(o.days).forEach(function (k) {
      var d = o.days[k];
      if (!isDay(k) || !isObj(d) || !strList(d.planIds) || !strList(d.doneIds) || !strList(d.touched) ||
          !isBool(d.extraDone) || !isNat(d.labRuns) || !isNat(d.teach) ||
          !(d.mood === null || ["good", "ok", "tired"].indexOf(d.mood) >= 0)) { bad("day " + k); return; }
      if (!d.doneIds.every(function (id) { return d.planIds.indexOf(id) >= 0; })) bad("day " + k + " done⊄plan");
    });
    if (!isObj(o.labRuns)) bad("labRuns"); else Object.keys(o.labRuns).forEach(function (k) {
      var r = o.labRuns[k];
      if (!isObj(r) || !isStr(r.lab) || !isDay(r.day) || ["predict", "observe", "complete"].indexOf(r.phase) < 0 ||
          !(r.prediction === null || isNat(r.prediction)) || !(r.predictionCorrect === null || isBool(r.predictionCorrect)) ||

/* ---------- 儲存 ---------- */
var memoryOnly = false;
function makeStorage(){
  try{var k="g5sci.probe";window.localStorage.setItem(k,"1");window.localStorage.removeItem(k);return window.localStorage;}
  catch(e){memoryOnly=true;var m={};return {getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);}};}
}
var store = C.createStore({storage:makeStorage(), bank:BANK, clock:function(){return Date.now();}});
store.load();
var seq = 0;
function newId(p){seq++;return (p||"a")+Date.now().toString(36)+seq.toString(36)+Math.floor(Math.random()*1e6).toString(36);}
function S(){return store.get().state;}
function V(){return store.view();}
function act(a){if(a.type!=="tick"&&!a.id)a.id=newId();var r=store.dispatch(a);banners();return r;}

/* ---------- 小工具 ---------- */
function $(s){return document.querySelector(s);}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function md(k){return k?(+k.slice(5,7))+"/"+(+k.slice(8,10)):"";}
function card(id){return C.cardById(S(),BANK,id);}
function conceptOn(cid){return C.conceptOn(S(),BANK,cid);}
function srcLine(c){return '<div class="src">'+esc(c.page?("出處："+c.page):SAMPLE)+"</div>";}
function on(sel,fn){var el=typeof sel==="string"?$(sel):sel;if(el)el.onclick=fn;}
var actx=null;
function chime(){
  if(!S().settings.sound) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [660,880].forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*0.12;o.frequency.value=f;o.type="sine";
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.3);});
  }catch(e){}
}

/* ---------- 天空場景：太陽放在今天台中的實際位置 ---------- */
// 天空場景帶：面向南方看（左東、右西），太陽畫在今天台中此刻的位置（晚上換成月亮）
function drawSky(){
  var el=$("#sky"), W=Math.max(300,Math.round(el.getBoundingClientRect().width||820)), H=132, base=104, x0=40, x1=W-40;
  var now=new Date(), hour=now.getHours()+now.getMinutes()/60;
  var st=sunTimes(now,TAICHUNG.lat,TAICHUNG.lon,TAICHUNG.tz), rise=st.rise||6, set=st.set||18;
  var f=(hour-rise)/(set-rise), up=f>=0&&f<=1, ff=Math.max(0,Math.min(1,f)), peak=86;
  var x=x0+(x1-x0)*ff, y=base-Math.sin(Math.PI*ff)*peak;
  el.setAttribute("viewBox","0 0 "+W+" "+H);
  var s='<rect width="'+W+'" height="'+H+'" fill="var(--sky1)"/><rect y="'+base+'" width="'+W+'" height="'+(H-base)+'" fill="var(--grass)"/>'+
    '<path d="M'+x0+' '+base+' C'+(x0+(x1-x0)*0.12)+' '+(base-peak*1.33)+' '+(x1-(x1-x0)*0.12)+' '+(base-peak*1.33)+' '+x1+' '+base+'" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 9" opacity=".9"/>';
  if(up) s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="26" fill="var(--sunball)" opacity=".25"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="17" fill="var(--sunball)"/>';
  else s+='<circle cx="'+(W-70)+'" cy="34" r="15" fill="#f4f1dc"/><circle cx="'+(W-62)+'" cy="29" r="13" fill="var(--sky1)"/>';
  s+='<text x="'+(x0-8)+'" y="'+(base+21)+'" font-size="16" fill="var(--ink)">東</text><text x="'+(x1+8)+'" y="'+(base+21)+'" font-size="16" text-anchor="end" fill="var(--ink)">西</text>'+
    '<text x="'+(W/2)+'" y="'+(base+21)+'" font-size="13" text-anchor="middle" fill="var(--ink)" opacity=".75">'+(W>=620?'面向南方看：太陽從東邊升起、經過南方天空、從西邊落下':'面向南方看')+'</text>';
  el.innerHTML=s;
}
window.addEventListener("resize",function(){drawSky();});

var screen="home";
function route(){
  var v=V(), se=v.session;

  if(screen==="practice"||screen==="end") return renderEnd();

  var inRound=se&&se.day===v.today&&se.queue.length&&!se.halted&&se.answered.length>0;
  if(!v.planIds.length){
    h='<div class="done"><b class="t">今天沒有排定卡片</b><p class="muted" style="margin:0">可以點下面的觀念看圖解、去實驗室玩，或「考考爸媽」。</p><div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="goTeach">考考爸媽</button></div></div>';
  }else if(v.completed){
    h='<div class="done"><b class="t">今天的卡片都做完了</b><p class="muted" style="margin:0">今天 '+v.M.cardProgress.planned+' 張全部完成。想加碼可以去實驗室、考考爸媽'+(se&&se.wrong.length?'，或再練答錯的卡':'')+'。</p>'+
      '<div class="row" style="justify-content:center">'+(se&&se.wrong.length?'<button class="btn ghost" type="button" id="goRedo">再練答錯的 '+se.wrong.length+' 張</button>':'')+'<button class="btn ghost" type="button" id="goTeach">考考爸媽</button></div></div>';
  }else{
    var due=v.planIds.filter(function(id){return C.cardState(S(),id).seen>0;}).length, fresh=v.planIds.length-due;
    var parts=[]; if(due) parts.push("到期複習 "+due+" 張"); if(fresh) parts.push("新卡 "+fresh+" 張"); if(v.doneIds.length) parts.push("已做 "+v.doneIds.length+" 張");
    h='<div class="today"><div class="big"><b>'+Math.max(0,C.diffDays(v.today,EXAM))+'</b><span class="muted small">天後考試</span></div><div style="display:grid;gap:10px">'+
      '<div style="font-size:23px;font-weight:700">'+(v.doneIds.length?'今天還有 '+left+' 張':'今天要練 '+left+' 張')+'</div>'+
      '<div class="muted">'+parts.join("、")+'。答錯可以看圖解、進實驗室弄懂。</div>'+
      '<div class="row">'+(inRound?'<button class="btn" type="button" id="goOn">繼續這一輪（還有 '+se.queue.length+' 張）</button>':'<button class="btn" type="button" id="goAll">開始今天的練習</button>')+
      (!inRound&&left>3?'<button class="btn ghost" type="button" id="goLight">今天有點累，只做 3 張</button>':'')+'</div></div></div>';
  }
  el.innerHTML=h;
  on("#goAll",function(){act({type:"sessionStart"});startRound();});
  on("#goLight",function(){act({type:"sessionStart",size:3});startRound();});
  on("#goOn",startRound);
  on("#goTeach",function(){renderTeach();});
  on("#goRedo",function(){var w=V().session.wrong.slice();act({type:"sessionStart",kind:"redo",ids:w});startRound();});

function renderCal(){
  var s=S(), v=V(), cells=[], k=START;
  while(k<=EXAM){
    var d=s.days[k], cls=(d&&d.touched.length)?"on":"";
    if(k===v.today) cls+=" today"; if(k===EXAM) cls+=" exam";
    cells.push('<i class="'+cls+'" title="'+md(k)+'">'+(k===EXAM?"考":(+k.slice(8,10)))+'</i>');
    k=C.addDays(k,1);
  }
  $("#cal").innerHTML=cells.join("");
  var n=0; k=v.today;
  if(!(s.days[k]&&s.days[k].touched.length)) k=C.addDays(k,-1);
  while(s.days[k]&&s.days[k].touched.length){n++;k=C.addDays(k,-1);}
  $("#streak").textContent=n?("連續練習 "+n+" 天"):"今天做 1 張就開始累積天數";
}
function toast(t){var el=$("#main"),d=document.createElement("div");d.className="hint";d.textContent=t;el.prepend(d);setTimeout(function(){d.remove();},3500);}

/* ---------- 題目（練習與考考爸媽共用同一個 renderer） ---------- */
function figureSvg(kind,annotated){
  var am=kind==="sun-am", sunX=am?70:290, sunY=24, topY=90, baseY=130;   // 面向南方：東在左、西在右
  var tipX=180+(180-sunX)*(baseY-topY)/(topY-sunY);
  var s='<figure style="margin:0"><svg class="fig" data-fig="'+kind+'" viewBox="0 0 360 170" role="img" aria-label="'+(am?"早上太陽在東邊":"下午太陽在西邊")+'，地上有一根竿子">'+
    '<rect width="360" height="170" rx="12" fill="var(--sky1)"/><line x1="10" y1="'+baseY+'" x2="350" y2="'+baseY+'" stroke="var(--muted)" stroke-width="2"/>'+
    '<circle cx="'+sunX+'" cy="'+sunY+'" r="18" fill="var(--sunball)"/><text x="'+sunX+'" y="'+(sunY+36)+'" text-anchor="middle" font-size="14" fill="var(--ink)">太陽</text>';
  if(annotated){
    s+='<line x1="'+sunX+'" y1="'+sunY+'" x2="'+tipX.toFixed(1)+'" y2="'+baseY+'" stroke="var(--sun)" stroke-width="2" stroke-dasharray="6 4"/>'+
      '<line x1="180" y1="'+baseY+'" x2="'+tipX.toFixed(1)+'" y2="'+baseY+'" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" opacity=".5"/>'+
      '<text class="ans-mark" x="'+((180+tipX)/2).toFixed(1)+'" y="'+(baseY-10)+'" text-anchor="middle" font-size="14" fill="var(--ink)">影子</text>';
  }
  s+='<line x1="180" y1="'+baseY+'" x2="180" y2="'+topY+'" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>'+
    '<text x="20" y="155" font-size="16" fill="var(--ink)">東</text><text x="340" y="155" text-anchor="end" font-size="16" fill="var(--ink)">西</text>'+
    '<text x="180" y="155" text-anchor="middle" font-size="14" fill="var(--muted)">竿子</text><text x="350" y="18" text-anchor="end" font-size="11" fill="var(--muted)">面向南方看</text></svg>'+
    (annotated?'<figcaption class="small">太陽在'+(am?"東":"西")+'，光直直照過來被竿子擋住，影子就落在相反的'+(am?"西":"東")+'邊。</figcaption>':'')+'</figure>';
  return s;
}
// mode: practice｜teach。teach 只畫題目與選項，不畫作答鈕；兩者的題圖完全相同（作答前不畫影子，免得洩題）
function questionHtml(c,mode){
  var h="";
  if(c.type==="figure") h+=figureSvg(c.fig,false);
  if(c.type==="map"){
    h+='<div class="q">'+esc(c.q)+'</div><div class="map"><div class="center">'+esc(c.center)+'</div><div class="branches">'+
      c.branches.map(function(b,i){return '<div class="branch"><b>'+esc(b.k)+'</b><span>'+esc(b.show)+'</span>'+(mode==="teach"?'<span class="muted">？</span>':'<button class="blank" type="button" data-i="'+i+'">？ 點我看答案</button>')+'</div>';}).join("")+'</div></div>';
    return h;
  }
  h+='<div class="q">'+esc(c.q)+'</div>';
  if(c.type==="choice"||c.type==="figure"){
    if(mode==="teach") h+='<ol style="margin:0;font-size:19px">'+c.opts.map(function(o){return '<li>'+esc(o)+'</li>';}).join("")+'</ol>';
    else h+='<div class="opts">'+c.opts.map(function(o,i){return '<button class="opt" type="button" data-i="'+i+'">'+esc(o)+'</button>';}).join("")+'</div>';
  }
  return h;
}
function answerText(c){return c.type==="recall"?c.ans:c.type==="map"?c.branches.map(function(b){return b.k+"："+b.blank;}).join("、"):c.opts[c.a];}

/* ---------- 練習 ---------- */
var ui={hint:false,cardId:null};
function renderPractice(){
  screen="practice";
  var v=V(), se=v.session, el=$("#main");
  if(!se||!se.queue.length||se.halted) return renderEnd();
  var id=se.queue[0], c=card(id);
  if(!c) return renderEnd();
  ui={hint:false,cardId:id,variation:se.kinds[id]==="variation"};
  var con=CONCEPTS[c.concept], total=se.answered.length+se.queue.length, pos=se.answered.length+1;
  var h='<div class="qhead"><span>'+esc(UNITS[con.unit])+'・'+esc(con.title)+(ui.variation?'<span class="tag">同觀念換一題確認</span>':'')+'</span><span>'+pos+' / '+total+'</span></div><div class="bar"><i style="width:'+Math.round((pos-1)/total*100)+'%"></i></div>';
  h+=questionHtml(c,"practice");
  var tools='<div class="tools"><label><input type="checkbox" id="unsure"> 我不太確定</label>'+(c.hint?'<button class="btn ghost sm" type="button" id="hintBtn">給我一點提示</button>':'')+'</div><div class="hint" id="hintBox" hidden></div>';
  if(c.type==="map"){
    h+='<div id="ansBox"><div class="row" id="grade" hidden><button class="btn" type="button" data-g="1">我全部想出來了</button><button class="btn ghost" type="button" data-g="0">有想不出來的</button></div></div>';
    el.innerHTML=h;
    var shown=0;
    el.querySelectorAll(".blank").forEach(function(b){b.onclick=function(){if(b.classList.contains("shown"))return;b.classList.add("shown");b.textContent=c.branches[+b.dataset.i].blank;shown++;if(shown===c.branches.length)$("#grade").hidden=false;};});
    el.querySelectorAll("#grade button").forEach(function(b){b.onclick=function(){el.querySelectorAll("#grade button").forEach(function(x){x.disabled=true;});submit(c,b.dataset.g==="1",{});};});
    return;
  }
  if(c.type==="recall"){
    h+='<p class="muted" style="margin:0">先在心裡（或說出來）回答，再看答案。</p>'+tools+'<div class="row" id="revealRow"><button class="btn" id="reveal" type="button">想好了，看答案</button></div><div id="ansBox"></div>';
    el.innerHTML=h; wireTools(c);
    on("#reveal",function(){
      $("#revealRow").hidden=true;
      $("#ansBox").innerHTML='<div class="fb ok"><strong>答案：'+esc(c.ans)+'</strong><span>'+esc(c.why||"")+'</span>'+srcLine(c)+'</div><div class="row" id="selfGrade" style="margin-top:10px"><button class="btn" type="button" data-g="1">我答對了</button><button class="btn ghost" type="button" data-g="0">我答錯了</button></div>';
      $("#selfGrade").querySelectorAll("button").forEach(function(b){b.onclick=function(){$("#selfGrade").querySelectorAll("button").forEach(function(x){x.disabled=true;});submit(c,b.dataset.g==="1",meta(),true);};});
    });
    return;
  }
  h+=tools+'<div id="ansBox"></div>';
  el.innerHTML=h; wireTools(c);
  el.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.i, ok=i===c.a;
    el.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(+x.dataset.i===c.a)x.classList.add("right");});
    if(!ok) b.classList.add("wrong");
    submit(c,ok,meta());
  };});
}
function wireTools(c){
  on("#hintBtn",function(){ui.hint=true;this.disabled=true;var box=$("#hintBox");box.hidden=false;box.textContent="提示："+c.hint;});
}
function meta(){var u=$("#unsure");return {unsure:!!(u&&u.checked),hint:ui.hint};}
var pending=null;
function submit(c,ok,m,selfGraded){
  var a={type:"answer",id:newId(),cardId:c.id,ok:ok,hint:!!m.hint,unsure:!!m.unsure,variation:!!ui.variation};
  pending={a:a,c:c,ok:ok,m:m,selfGraded:selfGraded};
  var r=act(a);
  if(!r.ok&&!r.dup){
    $("#ansBox").insertAdjacentHTML("beforeend",'<div class="fb no" id="saveFail"><strong>這一題還沒存到這台裝置</strong><div class="row"><button class="btn sm" type="button" id="saveAgain">再存一次</button></div></div>');
    on("#saveAgain",retrySave);
    return;
  }
  feedback(pending,r.info||{});
}
// 兩個「再存一次」（上方提示列、題目下方）走同一條路：存成功才公布回饋
function retrySave(){
  var rr=store.retry(); banners();
  if(!rr.ok) return;
  var f=$("#saveFail");
  if(f&&pending){f.remove();feedback(pending,rr.info||{});} else route();
}
function feedback(p,info){
  var c=p.c, ok=p.ok, shaky=ok&&(p.m.unsure||p.m.hint), box=$("#ansBox");
  if(ok){
    var today=V().today, before=S().log.some(function(e){return e.card===c.id&&!e.ok&&e.d<today;});
    var msg=shaky?"答對了！你有勾「不太確定」或用了提示，明天再確認一次。":info.graduated?"答對了！這張卡在 3 個不同的日子都答對，畢業了。":info.variation?"答對了！換了題目也會，觀念弄懂了。":before?"答對了！上次卡住的這題，這次你自己答對了。":"答對了！";
    if(!shaky) chime();
    if(!p.selfGraded) box.insertAdjacentHTML("beforeend",'<div class="fb ok"><strong>'+esc(msg)+'</strong><span>'+esc(c.why||"")+'</span>'+(c.type==="figure"?figureSvg(c.fig,true):"")+srcLine(c)+'</div>');
    else box.insertAdjacentHTML("beforeend",'<div class="fb ok"><strong>'+esc(msg)+'</strong></div>');
    box.insertAdjacentHTML("beforeend",'<div class="row"><button class="btn" id="next" type="button">下一題</button></div>');
    on("#next",renderPractice); $("#next").focus();
    return;
  }
  if(info.halted) return renderHalted(c,p.selfGraded);
  if(!p.selfGraded&&c.type!=="map") box.insertAdjacentHTML("beforeend",'<div class="fb no"><strong>正確答案是「'+esc(answerText(c))+'」</strong><span>'+esc(c.why||"")+'</span>'+(c.type==="figure"?figureSvg(c.fig,true):"")+srcLine(c)+'</div>');
  if(c.type==="map") box.insertAdjacentHTML("beforeend",'<div class="fb no"><span>'+esc(c.why||"")+'</span></div>');
  box.insertAdjacentHTML("beforeend",'<div class="fb" id="errq" style="background:var(--bg)"><strong>你覺得錯在哪裡？<span class="muted" style="font-weight:400">（自己選，沒有標準答案）</span></strong><div class="chips">'+
    Object.keys(ERRS).map(function(k){return '<button class="chip'+(k==="concept"?' pri':'')+'" type="button" data-k="'+k+'">'+ERRS[k]+'</button>';}).join("")+'<button class="chip" type="button" data-k="">先跳過</button></div></div>');
  $("#errq").querySelectorAll("button").forEach(function(b){b.onclick=function(){
    $("#errq").querySelectorAll("button").forEach(function(x){x.disabled=true;});
    b.classList.add("picked");
    var k=b.dataset.k;
    if(k==="concept") return remedy(c);
    var tip={reading:"下次先把題目的關鍵字圈起來，再看選項。",slip:"知道答案很棒！下次選之前再對一次題目。","":"沒關係，這張卡明天會再出現。"}[k];
    box.insertAdjacentHTML("beforeend",'<div class="fb ok"><span>'+esc(tip)+'</span><div class="row"><button class="btn" type="button" id="next">下一題</button></div></div>');
    on("#next",renderPractice); $("#next").focus();
  };});
}
// 補救：第一次＝說法一＋觀察任務；同觀念再卡住＝帶出上次紀錄、換另一種說法；做完任務換一題確認

  var ex=EXPLAIN[c.concept][r.info.way], prev=r.info.previous;
  var h='<div class="remedy" id="remedy"><div class="sect-t">一起弄懂</div>'+
    (prev?'<div class="prev">上次 '+md(prev.last)+' 你也在這個觀念卡住，那次看的是「'+esc(EXPLAIN[c.concept][prev.way].name)+'」。<br>先指給爸媽看：這一題是哪一步想不通？這次換一種說法：</div>':'')+
    '<strong style="font-size:19px">'+esc(ex.name)+'</strong>'+ex.svg()+'<ul>'+ex.lines.map(function(t){return '<li>'+esc(t)+'</li>';}).join("")+'</ul>'+askLine(ex)+
    '<div class="task"><strong>觀察任務</strong><span>'+esc(ex.task)+'</span></div>'+
    '<div class="row"><button class="btn" type="button" id="toLab">做觀察任務，再換一題確認</button><button class="btn ghost sm" type="button" id="skipRemedy">先跳過，下一題</button></div></div>';

/* ---------- 考考爸媽 ---------- */

LABS.sort=function(box){
  var ITEMS=[["胡蘿蔔","根"],["地瓜","根"],["白蘿蔔","根"],["馬鈴薯","莖"],["薑","莖"],["甘蔗","莖"],["蓮藕","莖"],["木材","莖"],["高麗菜","葉"],["菠菜","葉"],["花椰菜","花"],["金針花","花"],["番茄","果實"],["蘋果","果實"],["花生仁","種子"],["紅豆","種子"]];
  var HINT={"根":"它長在土裡，沒有節和芽眼。","莖":"它有節、芽眼，或是植物用來站直、運送水分的部分。","葉":"它是一片一片、一層一層的。","花":"它是植物開花的部分。","果實":"它是花謝了以後長出來、裡面常有種子的部分。","種子":"種下去會發芽長出新植物。"};
  var BINS=["根","莖","葉","花","果實","種子"], placed={}, sel=null;
  box.innerHTML='<p class="small muted" style="margin:0">先點一樣東西，再點它屬於植物的哪個部位。</p><div class="chips" id="soItems"></div><div class="bins" id="soBins"></div><div class="readout" id="soRo"></div>';
  function draw(){
    $("#soItems").innerHTML=ITEMS.map(function(it,i){return placed[i]?'':'<button class="chip'+(sel===i?' sel':'')+'" type="button" data-i="'+i+'">'+it[0]+'</button>';}).join("")||'<span class="small">全部放好了！</span>';
    $("#soBins").innerHTML=BINS.map(function(b){return '<button class="bin" type="button" data-b="'+b+'"><b>'+b+'</b><span>'+ITEMS.filter(function(it,i){return placed[i]&&it[1]===b;}).map(function(it){return it[0];}).join("、")+'</span></button>';}).join("");
    $("#soRo").textContent="放對 "+Object.keys(placed).length+" / "+ITEMS.length;
    document.querySelectorAll("#soItems button").forEach(function(b){b.onclick=function(){sel=+b.dataset.i;draw();};});
    document.querySelectorAll("#soBins button").forEach(function(b){b.onclick=function(){
      if(sel===null){$("#soRo").textContent="先點上面的一樣東西。";return;}
      if(ITEMS[sel][1]===b.dataset.b){placed[sel]=1;sel=null;chime();draw();if(Object.keys(placed).length===ITEMS.length)check(0);}
      else{var name=ITEMS[sel][0],chip=document.querySelector('#soItems button[data-i="'+sel+'"]');if(chip){chip.classList.remove("shake");void chip.offsetWidth;chip.classList.add("shake");}$("#soRo").textContent="「"+name+"」不是"+b.dataset.b+"。提示："+HINT[ITEMS[sel][1]];}
    };});
  }
  draw();
};
/* 3-1 溶解：重量由物質帳本算，溶解按經過時間（與幀率、減少動態效果無關） */
LABS.dissolve=function(box){
  box.innerHTML='<svg class="labsvg" viewBox="0 0 360 240" id="dsSvg"></svg><div class="row"><button class="btn sm" type="button" id="dsGo">放入方糖（10 g）</button><label class="toggle small"><input type="checkbox" id="dsStir"> 攪拌</label><label class="toggle small"><input type="checkbox" id="dsHot"> 熱水</label><button class="btn sun sm" type="button" id="dsSalt">加一匙鹽（6 g）</button><button class="btn ghost sm" type="button" id="dsNew">換一杯清水</button></div><div class="readout" id="dsRo">按「放入方糖」開始。溶解快慢是示意，不是真實測量。</div>';
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var m=C.dissolveNew(), P=[], sugarStart=null, coldDone=false, hotDone=false;
  function now(){return performance.now();}
  function sync(){m=C.dissolveStep(m,now());}
  function draw(){
    var r=C.dissolveRead(m);
    var s='<rect x="90" y="60" width="180" height="160" rx="10" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="92" y="78" width="176" height="140" fill="var(--waterfill)" opacity=".7"/>';
    if(r.sugarSolid>0){var w=26*Math.sqrt(r.sugarSolid/10);s+='<rect x="'+(180-w/2).toFixed(1)+'" y="'+(214-w).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+w.toFixed(1)+'" fill="#fff" stroke="var(--muted)"/>';}
    if(!reduce) P.forEach(function(p){s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="1.6" fill="var(--ink)" opacity=".45"/>';});
    else if(r.sugarDissolved>0||r.saltDissolved>0) s+='<text x="180" y="150" text-anchor="middle" font-size="13" fill="var(--ink)">（溶解的粒子小到看不見）</text>';
    for(var i=0;i<Math.round(r.saltSolid);i++) s+='<rect x="'+(110+(i*13)%140)+'" y="'+(210-Math.floor(i/11)*4)+'" width="5" height="4" fill="#fff" stroke="var(--muted)"/>';
    s+='<rect x="292" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/><text x="322" y="190" text-anchor="middle" font-size="16" fill="var(--ink)">'+r.scaleMass+' g</text><text x="322" y="210" text-anchor="middle" font-size="11" fill="var(--muted)">秤</text>';
    $("#dsSvg").innerHTML=s;
  }
  function tick(){
    sync(); var r=C.dissolveRead(m);
    if(!reduce){var rate=(m.hot?2:1)*(m.stir?2:1);if(r.sugarSolid>0)for(var i=0;i<rate;i++)if(P.length<260)P.push({x:180+(Math.random()-.5)*20,y:200,vx:(Math.random()-.5)*(m.stir?3:1),vy:-Math.random()*(m.stir?2.5:1)});
      P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<95||p.x>265)p.vx*=-1;if(p.y<80||p.y>212)p.vy*=-1;p.vx+=(Math.random()-.5)*.3;p.vy+=(Math.random()-.5)*.3;});}
    draw();
    if(r.sugarTotal>0&&r.sugarSolid===0&&m.sugarDoneAt!==null&&sugarStart!==null){
      var sec=((m.sugarDoneAt-sugarStart)/1000).toFixed(1), label=(m.hot?"熱水":"冷水")+(m.stir?"＋攪拌":"");
      $("#dsRo").innerHTML='方糖不見了，可是糖還在水裡（分散成看不見的小粒子）。'+label+'：花了 '+sec+' 秒（示意）。<br>秤重：杯子＋水 '+m.base+' g、糖 '+r.sugarTotal+' g；溶解後一起秤 <b>'+r.scaleMass+' g</b>，重量一樣。';
      if(!m.hot) coldDone=true; else hotDone=true;
      if(coldDone) check(0); if(hotDone) check(1); check(2);
      sugarStart=null;
    }
    if(r.sugarSolid>0||(!reduce&&P.length)) labTimer=requestAnimationFrame(tick); else labTimer=null;
  }
  function start(){if(!labTimer) labTimer=requestAnimationFrame(tick);}
  on("#dsGo",function(){sync();if(C.dissolveRead(m).sugarSolid>0){$("#dsRo").textContent="上一顆方糖還在溶解，等它溶完再放。";return;}
    m=C.dissolveAddSugar(m,now()); sugarStart=now(); $("#dsRo").textContent="糖正在溶解……"; start();});
  $("#dsStir").onchange=function(e){sync();m.stir=e.target.checked;};
  $("#dsHot").onchange=function(e){sync();m.hot=e.target.checked;};
  on("#dsSalt",function(){sync();m=C.dissolveAddSalt(m);var r=C.dissolveRead(m);
    if(!reduce&&r.saltSolid===0)for(var i=0;i<20;i++)P.push({x:180+(Math.random()-.5)*60,y:90+Math.random()*120,vx:(Math.random()-.5),vy:(Math.random()-.5)});
    $("#dsRo").innerHTML=r.saltSolid===0?'加了 '+(r.saltTotal/6)+' 匙鹽（'+r.saltTotal+' g），攪一攪都溶解了。秤：'+r.scaleMass+' g。':'加到第 '+(r.saltTotal/6)+' 匙，杯底的鹽<b>溶不下了</b>（留下 '+r.saltSolid+' g）：同樣多的水、同樣溫度，能溶解的量有限度。秤：'+r.scaleMass+' g。（數量是示意）';
    if(r.saltSolid>0) check(3); draw(); start();});
  on("#dsNew",function(){stopAnim();m=C.dissolveNew();m.hot=$("#dsHot").checked;m.stir=$("#dsStir").checked;P=[];sugarStart=null;draw();$("#dsRo").textContent="換了一杯清水：秤 "+m.base+" g。";});
  draw();
};

/* ---------- 出口題 ---------- */
function renderExit(){
  var list=C.exitList(S(),{bank:BANK,now:Date.now()}), el=$("#exitList");
  if(!list.length){el.innerHTML='<p class="muted" style="margin:0">練過的觀念會出現在這裡。隔天不看提示、用說的或寫在紙上回答，答得出來才算真的學會。</p>';return;}
  var ready=list.filter(function(x){return x.ready;}), later=list.filter(function(x){return !x.ready&&x.status!=="pass";}), passed=list.filter(function(x){return x.status==="pass";});
  var h='<p class="small muted" style="margin:0 0 10px">不給提示、不給選項，請她用說的或寫在紙上。這些題目在練習裡沒出現過。答得出來，植物就會開花。</p>';
  if(ready.length) h+='<ol class="exits">'+ready.map(function(x){var c=CONCEPTS[x.cid];
    return '<li><div><strong>'+esc(c.title)+'</strong>'+(x.status==="fail"?' <span class="small muted">上次（'+md(x.last)+'）還不行，再問一次</span>':'')+'</div><div>'+esc(c.exit)+'</div>'+
      '<details><summary>參考答案</summary><div class="small">'+esc(c.exitAns)+'</div></details>'+
      '<div class="row" style="margin-top:6px"><button class="btn ghost sm" type="button" data-c="'+x.cid+'" data-r="pass">答得出來</button><button class="btn ghost sm" type="button" data-c="'+x.cid+'" data-r="fail">還不行</button></div></li>';}).join("")+'</ol>';
  else h+='<p style="margin:0">今天沒有要問的出口題。</p>';
  if(later.length) h+='<p class="small muted">明天以後再問：'+later.map(function(x){return esc(CONCEPTS[x.cid].short)+'（'+md(x.due)+'）';}).join("、")+'</p>';
  if(passed.length) h+='<div class="small" style="display:grid;gap:6px">'+passed.map(function(x){return '<div class="row">已答得出來：'+esc(CONCEPTS[x.cid].short)+'（'+md(x.last)+'）<button class="btn ghost sm" type="button" data-retest="'+x.cid+'">再考一次</button></div>';}).join("")+'</div>';
  el.innerHTML=h;
  el.querySelectorAll("button[data-c]").forEach(function(b){b.onclick=function(){act({type:"exit",cid:b.dataset.c,result:b.dataset.r});renderSide();renderConcepts();};});
  el.querySelectorAll("button[data-retest]").forEach(function(b){b.onclick=function(){act({type:"exitRetest",cid:b.dataset.retest});renderSide();};});
}

/* ---------- 家長摘要：只留三個數 ---------- */
function renderSummary(){
  var v=V(), cp=v.M.cardProgress;
  var lines=["五上自然複習 "+md(v.today)+"（距考試 "+Math.max(0,C.diffDays(v.today,EXAM))+" 天）",
    "今天卡片："+(cp.planned?cp.done+" / "+cp.planned+" 張"+(v.completed?"（完成）":""):"今天沒有排定卡片"),
    "出口題待辦："+v.M.exitPending+" 題"+(v.exitLater?"（另有 "+v.exitLater+" 題明天以後再問）":""),
    "今天加碼："+(v.M.extraDone?"有（做完卡片後又自己多做）":"還沒有")];
  if(v.needsHelp.length) lines.push("需要爸媽陪著看："+v.needsHelp.map(function(c){return CONCEPTS[c].short;}).join("、"));
  $("#summary").innerHTML='<div style="display:grid;gap:14px"><div class="three"><div><span class="small muted">今天卡片</span><b>'+cp.done+' / '+cp.planned+'</b></div><div><span class="small muted">出口題待辦</span><b>'+v.M.exitPending+'</b></div><div><span class="small muted">今天加碼</span><b>'+(v.M.extraDone?"有":"還沒")+'</b></div></div>'+
    (v.needsHelp.length?'<div class="banner info"><strong>需要爸媽陪著看：'+v.needsHelp.map(function(c){return esc(CONCEPTS[c].short);}).join("、")+'</strong><div class="row">'+v.needsHelp.map(function(c){return '<button class="btn ghost sm" type="button" data-helped="'+c+'">已經陪她看過「'+esc(CONCEPTS[c].short)+'」</button>';}).join("")+'</div></div>':'')+
    '<pre id="sumText" style="white-space:pre-wrap;margin:0;font-family:var(--f-body)">'+esc(lines.join("\n"))+'</pre>'+
    '<div class="row"><button class="btn ghost sm" id="copySum" type="button">複製摘要（貼到 LINE）</button><span class="small muted" id="copyMsg"></span></div>'+
    '<p class="small" style="margin:0;background:var(--sun-soft);border-radius:12px;padding:10px 14px">給爸媽：請不要用「做完就給獎品」。研究（Deci, Koestner & Ryan 1999，128 個實驗）發現，事先說好的實質獎勵會降低孩子自己想做的意願；具體說出她哪裡進步（例如「上次錯的影子題，今天你自己講出原因了」）效果比較好。</p></div>';
  $("#summary").querySelectorAll("button[data-helped]").forEach(function(b){b.onclick=function(){act({type:"helped",cid:b.dataset.helped});renderSide();renderConcepts();};});
  on("#copySum",function(){
    var t=lines.join("\n");
    function done(){$("#copyMsg").textContent="已複製";}
    function fail(){var r=document.createRange();r.selectNodeContents($("#sumText"));var s=getSelection();s.removeAllRanges();s.addRange(r);$("#copyMsg").textContent="已選取文字，請按複製";}
    try{navigator.clipboard.writeText(t).then(done,fail);}catch(e){fail();}
  });
}
function renderSide(){header();banners();renderConcepts();renderCal();renderExit();renderSummary();renderSettings();}

/* ---------- 設定 ---------- */
function renderSettings(){
  var s=S(), st=store.get();
  $("#u3").checked=!!s.settings.unit3; $("#snd").checked=!!s.settings.sound;
  $("#storeMsg").textContent=st.loadError?"存檔讀不出來，目前不會存檔。":memoryOnly?"這台裝置存不了作答紀錄。":"作答紀錄只存在這台裝置的瀏覽器（不上傳）。"+(st.migrated?"已把舊版紀錄搬過來；舊版的「畢業」要重新確認一次。":"");
  var rr=$("#resetRow");
  if(st.loadError){rr.innerHTML='<button class="btn warn sm" id="discard" type="button">清除壞掉的存檔，重新開始</button>';on("#discard",function(){rr.innerHTML='<span>確定要清除？舊存檔會被覆蓋。</span><button class="btn warn sm" id="discardYes" type="button">清除</button><button class="btn ghost sm" id="discardNo" type="button">取消</button>';on("#discardNo",renderSettings);on("#discardYes",function(){store.discardBroken();renderHome();});});return;}
  if(!rr.dataset.state){rr.innerHTML='<button class="btn ghost sm" id="resetBtn" type="button">清除全部作答紀錄</button>';
    on("#resetBtn",function(){rr.dataset.state="ask";rr.innerHTML='<span>確定要清除所有作答紀錄？</span><button class="btn warn sm" id="resetYes" type="button">清除</button><button class="btn ghost sm" id="resetNo" type="button">取消</button>';
      on("#resetNo",function(){delete rr.dataset.state;renderSettings();});
      on("#resetYes",function(){delete rr.dataset.state;act({type:"reset"});renderHome();});});}
}
$("#u3").onchange=function(e){act({type:"settings",unit3:e.target.checked});renderSide();};
$("#snd").onchange=function(e){act({type:"settings",sound:e.target.checked});};
on("#importBtn",function(){
  var msg=$("#importMsg");
  try{
    var arr=JSON.parse($("#importBox").value);
    if(!Array.isArray(arr)) throw new Error("最外層要是 [ … ]");
    var r=act({type:"import",cards:arr});
    if(!r.ok){msg.textContent="沒有存到，請再按一次加入。";return;}
    msg.textContent="加入 "+r.info.acceptedIds.length+" 張（明天開始出）"+(r.info.rejectedIds.length?"，略過 "+r.info.rejectedIds.length+" 張（重複、缺欄位、答案編號或圖片代號不對）":"");
    if(r.info.acceptedIds.length)$("#importBox").value="";
  }catch(e){msg.textContent="格式不對："+e.message;}
});

/* ---------- 啟動與跨午夜 ---------- */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible") return;
  var changed=V().today!==shownDay; act({type:"tick"});
  if(changed){ if(screen==="practice") route(); else renderHome(); renderSide(); }
  else if(screen==="home") renderHome();
  else renderSide();
});
renderHome();
})();
</script>
