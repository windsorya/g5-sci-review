<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="自然複習"></head><body><title>五上自然複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Huninn&display=swap">
<style>
/* 版面（A 晴空實驗室）：上方天空場景＋倒數，中間是今天的任務或練習卡，六個觀念入口，下方收合家長工具 */
:root{
  --bg:#f4f8fb; --card:#ffffff; --ink:#17324a; --muted:#4a6276; --line:#c9d7e2; --line-soft:#dde7ef;
  --pri:#1f5f8b; --pri-soft:#e9f2f8; --on-pri:#ffffff;
  --sun:#b4770c; --sun-deep:#8a5a0a; --sunball:#f2b632; --sun-soft:#f8ecd6;
  --leaf:#2f7d4f; --leaf-soft:#e2efe6; --soil:#8a5a3b;
  --bad:#b4442f; --bad-soft:#fbe7e2;
  --sky1:#cfe6f5; --sky2:#b7d9ef; --grass:#8fc79a; --waterfill:#bcdcef; --red:#d23c3c;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Heiti TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --r:18px; --shadow:0 2px 10px rgba(23,50,74,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a24; --card:#172634; --ink:#e4eef6; --muted:#9db3c4; --line:#2c4256; --line-soft:#223545;
  --pri:#6fb0de; --pri-soft:#1a3347; --on-pri:#0b1620;
  --sun:#e6b25a; --sun-deep:#f0c879; --sunball:#f2c14e; --sun-soft:#3a2f1b;
  --leaf:#6cc08e; --leaf-soft:#1c3328; --soil:#b58660;
  --bad:#ec8a74; --bad-soft:#3a221d;
  --sky1:#1b3550; --sky2:#183047; --grass:#2f5a3a; --waterfill:#24506b; --red:#ff7a7a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a24; --card:#172634; --ink:#e4eef6; --muted:#9db3c4; --line:#2c4256; --line-soft:#223545;
  --pri:#6fb0de; --pri-soft:#1a3347; --on-pri:#0b1620;
  --sun:#e6b25a; --sun-deep:#f0c879; --sunball:#f2c14e; --sun-soft:#3a2f1b;
  --leaf:#6cc08e; --leaf-soft:#1c3328; --soil:#b58660;
  --bad:#ec8a74; --bad-soft:#3a221d;
  --sky1:#1b3550; --sky2:#183047; --grass:#2f5a3a; --waterfill:#24506b; --red:#ff7a7a; --shadow:none; color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--pri)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.03em}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 56px;display:grid;gap:18px}
.muted{color:var(--muted)} .small{font-size:15px}
/* 天空場景 */
.hero{margin:0 -16px;background:var(--sky1);overflow:hidden}
.hero .txt{padding:24px 24px 0;display:grid;gap:4px}
.hero h1{font-size:clamp(32px,6vw,44px);line-height:1.15}
.hero .left{font-size:15px;color:var(--muted)}
.hero .left b{color:var(--sun-deep);font-variant-numeric:tabular-nums}
.hero svg.sky{display:block;width:100%;height:132px}
@media (min-width:821px){.hero{margin:0;border-radius:0 0 var(--r) var(--r)}}
.banner{border-radius:14px;padding:12px 16px;display:grid;gap:8px;background:var(--bad-soft)}
.banner.info{background:var(--sun-soft)}
/* 面板 */
.panel{background:var(--card);border-radius:var(--r);padding:22px;display:grid;gap:16px;box-shadow:var(--shadow);min-width:0}
.today{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.today .big{display:grid;justify-items:center;min-width:88px}
.today .big b{font-family:var(--f-display);font-weight:400;font-size:56px;line-height:1;color:var(--sun-deep);font-variant-numeric:tabular-nums}
@media (max-width:520px){.today{grid-template-columns:1fr}.today .big{justify-items:start}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{background:var(--pri);color:var(--on-pri);border:0;border-radius:14px;padding:12px 22px;font-size:19px;font-weight:700;min-height:52px}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:500;font-size:17px}
.btn.sun{background:var(--sun);color:#fff}
.btn.leaf{background:var(--leaf);color:#fff}
.btn.warn{background:var(--bad);color:#fff}
.btn.sm{font-size:16px;padding:9px 14px;min-height:46px;font-weight:500}
.sect-t{font-size:19px;font-weight:700}

.concepts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.ccard b{font-size:18px} .ccard .st{font-size:14px;color:var(--leaf)} .ccard .due{font-size:14px;color:var(--muted)}
.ccard.off{background:var(--line-soft);border-style:dashed;box-shadow:none;color:var(--muted)}
.ccard.help{border-color:var(--bad)}

.cal{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:6px}

.cal i{display:flex;align-items:center;justify-content:center;height:34px;border-radius:8px;background:var(--line-soft);color:var(--muted);font-size:13px;font-style:normal;font-variant-numeric:tabular-nums}
.cal i.on{background:var(--leaf);color:#fff}
.cal i.today{box-shadow:inset 0 0 0 2px var(--sun)}
.cal i.exam{background:var(--sun-soft);color:var(--sun-deep)}

.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}
.tag{display:inline-block;background:var(--sun-soft);color:var(--sun-deep);border-radius:8px;padding:0 10px;font-size:14px;margin-left:6px}
.q{font-size:clamp(21px,3.4vw,26px);line-height:1.5;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 18px;text-align:left;font-size:20px;min-height:58px}
.opt.right{border:3px solid var(--leaf);background:var(--leaf-soft);opacity:1}
.opt.wrong{border:3px solid var(--bad);background:var(--bad-soft);opacity:1}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--pri)}}
.tools{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.tools label{display:flex;gap:10px;align-items:center;min-height:46px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--pri);flex:none}
.hint{background:var(--pri-soft);border-radius:12px;padding:10px 14px}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--leaf-soft)} .fb.no{background:var(--bad-soft)}
.src{font-size:13px;color:var(--muted)}
.map .center{justify-self:center;font-family:var(--f-display);font-size:22px;padding:8px 18px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.map{display:grid;gap:12px}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.branch{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.blank{border:0;background:var(--sun-soft);border-radius:10px;padding:10px;text-align:left;min-height:46px}
.blank.shown{background:var(--leaf-soft)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;min-height:48px;font-size:17px}
.chip.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.chip.sel,.chip.picked{border-color:var(--sun);background:var(--sun-soft);color:var(--ink);opacity:1}
.chip.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 補救 */
.remedy{border:2px solid var(--pri);background:var(--pri-soft);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.remedy ul{margin:0;padding-left:22px;display:grid;gap:6px}
.prev{background:var(--card);border-radius:12px;padding:8px 12px;font-size:15px}
.fig{width:100%;height:auto;display:block;border-radius:14px}
/* 實驗室 */
.lab{border:2px solid var(--pri);border-radius:var(--r);padding:16px;display:grid;gap:14px;background:var(--card)}
.lab h2{font-size:22px;color:var(--pri)}
.task{background:var(--pri-soft);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.ck{display:flex;gap:10px;align-items:center}
.ck svg{flex:none}
.ck.got{color:var(--leaf)}
.labsvg{width:100%;height:auto;display:block;border-radius:12px;background:var(--pri-soft)}

input[type=range]{width:100%;height:40px;accent-color:var(--sun)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;min-height:46px}
.tabs button.on{border-color:var(--pri);color:var(--pri);font-weight:700}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bin{border:2px dashed var(--leaf);border-radius:12px;padding:8px;min-height:84px;display:grid;align-content:start;gap:4px;background:var(--leaf-soft);text-align:left}
.bin b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--leaf)}
.bin span{font-size:14px}
.pots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pot{background:var(--card);border:2px solid var(--line-soft);border-radius:14px;padding:8px;display:grid;justify-items:center;gap:4px}
.pot svg{width:100%;max-width:120px;height:auto}
.toggle{display:flex;gap:10px;align-items:center;min-height:46px}
/* 結尾、家長 */
.done{text-align:center;display:grid;gap:14px;justify-items:center}
.done b.t{font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--leaf)}
.moods{display:flex;gap:12px}
.moods button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:6px;min-width:64px;min-height:64px;display:grid;place-items:center}
.moods button.on{border-color:var(--sun);background:var(--sun-soft)}
details{background:var(--card);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow)}
details>summary{cursor:pointer;font-family:var(--f-display);font-size:20px;min-height:32px}
details[open]>summary{margin-bottom:12px}
details details{box-shadow:none;padding:6px 0;background:transparent}
details details>summary{font-family:var(--f-body);font-size:15px}
.exits{display:grid;gap:16px;margin:0;padding-left:22px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.three div{background:var(--bg);border-radius:12px;padding:10px;display:grid;gap:2px}
.three b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--pri);font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:120px;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);box-sizing:border-box}
.links a{color:var(--pri)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
// 太陽位置（NOAA 簡化公式）：給日期、當地時間（小時，可帶小數）、緯度、經度、時區，
// 回傳 {alt: 高度角°, az: 方位角°（正北為 0，順時針）}。影子實驗室用台中（24.15N, 120.68E, UTC+8）。
// 精度約 ±0.5°，對五年級的「方位＋高度角」教學足夠；日出日落用 alt=0 求。
function sunPosition(date, hour, lat, lon, tz) {
  var rad = Math.PI / 180;
  var start = Date.UTC(date.getFullYear(), 0, 1);
  var today = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
  var n = Math.round((today - start) / 86400000) + 1;
  var g = 2 * Math.PI / 365 * (n - 1 + (hour - 12) / 24);
  var eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
    - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g)
    + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  var tst = hour * 60 + eqt + 4 * lon - 60 * tz;
  var ha = (tst / 4 - 180) * rad;
  var phi = lat * rad;
  var cosZ = Math.sin(phi) * Math.sin(decl) + Math.cos(phi) * Math.cos(decl) * Math.cos(ha);
  var zen = Math.acos(Math.max(-1, Math.min(1, cosZ)));
  var az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(phi) - Math.tan(decl) * Math.cos(phi)) / rad + 180;
  return { alt: 90 - zen / rad, az: (az + 360) % 360 };
}
// 日出、日落（當地時間，小時）：以 1 分鐘步進找高度角過 0 的時刻
function sunTimes(date, lat, lon, tz) {
  var rise = null, set = null, prev = sunPosition(date, 4, lat, lon, tz).alt;
  for (var m = 4 * 60 + 1; m <= 20 * 60; m++) {
    var a = sunPosition(date, m / 60, lat, lon, tz).alt;
    if (prev <= 0 && a > 0 && rise === null) rise = m / 60;
    if (prev > 0 && a <= 0) set = m / 60;
    prev = a;
  }
  return { rise: rise, set: set };
}
if (typeof module !== "undefined") module.exports = { sunPosition: sunPosition, sunTimes: sunTimes };

</script>
<script>
// 看圖題的圖（2026-10-11）：照考古卷題型「自己重畫」，不用原卷圖片（著作權屬原學校，網站是公開的）。
// 規則：凡是跟太陽有關的座標，一律由 sun.js 的 sunPosition 算出來，不憑手感畫（五個科學圖錯的教訓）。
// 匯出 G5_FIGS = { kinds: {名稱: 繪圖函式(annotated)}, geo: {…可測的幾何…} }；app.html 的 figureSvg 遇到這裡的圖種就交給它畫。
(function (root) {
  "use strict";
  var TC = { lat: 24.15, lon: 120.68, tz: 8 };
  function sunAt(date, hour) {
    var f = root.sunPosition || (typeof require === "function" ? require("./sun.js").sunPosition : null);
    return f(date, hour, TC.lat, TC.lon, TC.tz);
  }
  function r1(x) { return Math.round(x * 10) / 10; }
  function wrap(kind, label, inner, cap) {
    return '<figure style="margin:0"><svg class="fig" data-fig="' + kind + '" viewBox="0 0 360 220" role="img" aria-label="' + label + '">' +
      '<rect width="360" height="220" rx="12" fill="var(--sky1)"/>' + inner + '</svg>' + (cap ? '<figcaption class="small">' + cap + '</figcaption>' : '') + '</figure>';
  }
  function txt(x, y, s, size, anchor, fill) {
    return '<text x="' + r1(x) + '" y="' + r1(y) + '" font-size="' + (size || 14) + '" text-anchor="' + (anchor || "middle") + '" fill="' + (fill || "var(--ink)") + '">' + s + '</text>';
  }

  /* ---------- 1. 竿影一天紀錄（俯視圖，上方是北） ---------- */
  var POLE_DATE = new Date(2026, 9, 15);           // 台中 10 月 15 日（期中考前）
  var POLE_HOURS = [8, 9, 10, 11, 12, 13, 14, 15, 16];
  var POLE = { x: 180, y: 190 };
  function poleDay() {
    var raw = POLE_HOURS.map(function (h) {
      var p = sunAt(POLE_DATE, h), dir = (p.az + 180) % 360, len = 1 / Math.tan(p.alt * Math.PI / 180);
      return { h: h, sunAz: p.az, alt: p.alt, dir: dir, len: len };
    });
    // 俯視、上北下南、左西右東：x＝東西、y 往上＝北。整體縮放到最長影子 170（螢幕座標）。
    var maxDx = Math.max.apply(null, raw.map(function (s) { return Math.abs(Math.sin(s.dir * Math.PI / 180) * s.len); }));
    var maxDy = Math.max.apply(null, raw.map(function (s) { return Math.max(0, Math.cos(s.dir * Math.PI / 180) * s.len); }));
    var k = Math.min(165 / maxDx, 165 / maxDy);
    raw.forEach(function (s) {
      s.x = POLE.x + Math.sin(s.dir * Math.PI / 180) * s.len * k;
      s.y = POLE.y - Math.cos(s.dir * Math.PI / 180) * s.len * k;

    ch("k25", "1-1", "觀察竿影時，下午 5 點的竿影和下午 4 點比起來會怎樣？", ["比較短", "一樣長", "比較長", "會消失不見"], 2, "越接近傍晚，太陽越低、高度角越小，竿影就越長。", R1, "太陽越低，影子越……"),
    ch("k26", "1-1", "從早上到下午，竿影移動的方向和太陽移動的方向分別是？", ["竿影由東向西；太陽由西向東", "竿影由西向東；太陽由東向西", "兩個都是由東向西", "兩個都是由西向東"], 1, "太陽由東向西移動；影子在太陽的相反方向，所以竿影由西向東移動。", R1, "影子永遠站在太陽的對面"),
    ch("k27", "1-2", "下列哪一個現象和光的「折射」有關？", ["平靜的水面映出倒影", "金屬湯匙的表面會反光", "插在水杯裡的吸管看起來像斷掉了", "照鏡子看到自己"], 2, "吸管一半在水裡、一半在空氣中，光從水進入空氣時偏折，看起來像斷掉，這是折射；水面倒影、湯匙反光和照鏡子都是光的反射。", R1, "哪一個有「水和空氣的交界」？"),
    ch("k28", "2-2", "雌蕊包含哪幾個部分？", ["花藥、花絲", "柱頭、花柱、子房", "花瓣、花萼", "花藥、柱頭"], 1, "雌蕊由上到下是柱頭、花柱、子房；雄蕊是花藥和花絲。", R1, "最下面膨大的是子房"),
    ch("k29", "2-2", "吊蘭、萬年青、馬鈴薯、石蓮，哪一種常用「一片葉子」就能長出新植物？", ["吊蘭", "萬年青", "馬鈴薯", "石蓮"], 3, "石蓮掉下來的葉子放在土上，葉子基部會長出根和小芽，變成新植物。吊蘭常用走莖、萬年青常把莖插在水裡、馬鈴薯用塊莖來繁殖。", R1, "哪一種的葉子肥肥厚厚、掉了還會長？"),
    // 卷 2：彰化縣田中國小 113 學年
    tf("k30", "1-2", "光垂直射入水面時，前進的方向會偏折。", false, "光垂直進入水中，前進方向不會改變；要「斜斜的」進入，才會在交界處偏折。", R2),
    tf("k31", "2-1", "絲瓜的莖又高又直，可以自己挺立起來爭取陽光。", false, "絲瓜的莖細細長長、站不直，它用捲鬚攀附在其他東西上往上爬，才能爭取到陽光。", R2),
    tf("k32", "1-3", "在臺灣，秋分這一天太陽直射赤道，白天和夜晚差不多一樣長。", true, "春分、秋分太陽直射赤道，在臺灣白天和夜晚大約各 12 小時。", R2),
    ch("k33", "1-1", "在操場上看到自己的影子在西北方，這時太陽大約在哪一方？", ["西南方", "東南方", "東北方", "西北方"], 1, "影子在太陽的正對面。影子在西北，太陽就在東南。", R2, "把方位整個反過來"),
    ch("k34", "1-2", "調整放大鏡和物體的距離，下列哪一種影像「看不到」？", ["放大、正立", "縮小、倒立", "縮小、正立", "放大、倒立"], 2, "放大鏡靠近物體看到放大正立的像；拉遠可以看到倒立的像（有時放大、有時縮小）。只有「縮小又正立」看不到。", R2, "正立的像一定是放大的"),
    ch("k35", "2-3", "哪一種植物的葉子不沾水、可以自己保持乾淨，常被用「出淤泥而不染」來形容？", ["蘭花", "蓮花", "梅花", "大王花"], 1, "蓮花的葉子表面讓水滴滾走、順便帶走髒東西，人們模仿它做出防水、自我清潔的材料。", R2, "長在池塘爛泥裡的花"),
    tf("k36", "2-1", "石蓮生長在乾燥的地方，所以它的「根」特別肥厚，用來儲存水分。", false, "石蓮肥厚的是「葉」，用葉子儲存水分；根並不特別肥厚。", R2),
    tf("k37", "2-2", "雀榕的果實主要靠水漂流到別的地方。", false, "雀榕的果實小小的，被鳥吃下去，種子跟著糞便散播，是靠動物。靠水漂流的是椰子、林投。", R2),
    tf("k38", "2-2", "林投的果實可以浮在水面上，隨著水流散播種子。", true, "林投常長在海邊，果實可以浮在海水上漂到遠方。", R2),
    // 卷 3：彰化縣成功國小 113 學年
    tf("k39", "2-2", "把黃金葛的莖放在水裡，莖上的節會長出根和葉子，長成新的植物。", true, "黃金葛可以用莖繁殖：剪一段帶節的莖泡水，節上會長出根和新葉。", R3),
    ch("k40", "1-2", "空碗底放一枚硬幣，眼睛位置剛好看不到硬幣。慢慢加水後，就看得到硬幣了。主要原因是什麼？", ["加水把硬幣浮起來了", "硬幣實際的位置沒有變，是光的折射讓它看起來變高", "水面像鏡子，映出硬幣的倒影", "水把硬幣變大了"], 1, "硬幣沒有移動。硬幣反射的光從水進入空氣時偏折（折射），我們看到的硬幣好像變高了，所以看得到。", R3, "硬幣真的有動嗎？"),
    ch("k41", "1-1", "早上太陽在正東方。起跑時，影子剛好在他的正後方，他面向哪一方起跑？", ["東方", "南方", "西方", "北方"], 0, "影子在正後方，表示太陽在他的正前方；太陽在正東方，所以他面向東方。", R3, "影子在後面，太陽就在……"),
    ch("k42", "1-1", "比賽時如果面向西方起跑，又想要「背對太陽」，哪一個時間比較適合？", ["上午 8 時", "中午 12 時", "下午 2 時", "下午 4 時"], 0, "面向西方時，背後是東方。背對太陽＝太陽在東邊，那是上午。", R3, "背後是哪一方？"),
    ch("k43", "1-3", "住在嘉義（北回歸線經過）的人，四季代表日中午測太陽高度角。夏至、春分、冬至大約分別是？", ["90 度、67 度、43 度", "43 度、67 度、90 度", "67 度、90 度、43 度", "三天都是 90 度"], 0, "嘉義在北回歸線上，夏至中午太陽幾乎在頭頂（約 90 度）；春分、秋分約 67 度；冬至最低，約 43 度。", R3, "夏至最高，冬至最低"),
    ch("k44", "1-3", "恰好位在北回歸線上的地方，一年中，中午太陽會正好在頭頂上大約幾次？", ["0 次", "1 次，在夏至前後", "2 次，在春分和秋分", "每天都會"], 1, "太陽直射的位置一年中在南、北回歸線之間來回。剛好在北回歸線上的地方，只有夏至前後中午會遇到太陽直射一次。", R3, "太陽最北只走到北回歸線"),
    // 卷 4：彰化縣田中國小 112 學年
    tf("k45", "1-2", "光從斜上方進入水中，在水面和空氣的交界會產生「反射」，所以前進方向偏折了。", false, "光斜斜的進入另一種物質而偏折，叫做「折射」，不是反射。", R4),
    tf("k46", "2-1", "種在窗戶旁邊的植物，莖常會朝著有陽光的方向生長。", true, "莖會朝光生長，讓葉子照到更多陽光，進行光合作用製造養分。", R4),
    ch("k47", "1-1", "做「光源角度和影子長短」的實驗時，竿子高度、竿子的位置都要保持一樣。這些保持不變的條件叫做什麼？", ["操縱變因", "應變變因", "控制變因", "以上都不是"], 2, "實驗中故意改變的是操縱變因（光源角度），跟著變、要觀察的是應變變因（影子長短），保持不變的叫控制變因。", R4, "「控制」住不讓它變"),
    ch("k48", "1-3", "太陽直射南回歸線、北半球白天最短、夜晚最長的那一天是？", ["春分", "夏至", "秋分", "冬至"], 3, "冬至太陽直射南回歸線，北半球的太陽路徑最偏南、最低，白天最短。", R4, "吃湯圓的那一天"),
    // 卷 5：中正國小 112 學年
    tf("k49", "1-1", "我們每天看到太陽東升西落，是因為地球在自轉。", true, "地球由西向東自轉，所以我們看到太陽好像由東邊升起、往西邊落下。", R5),
    tf("k50", "1-3", "夏至太陽直射北回歸線，所以在臺灣，夏至的日出在東南方、日落在西南方。", false, "夏至前後，臺灣看到太陽從東偏北升起、西偏北落下；從東偏南升起的是冬天。", R5),
    tf("k51", "2-3", "茶樹是經濟植物，所以應該盡量把山坡地都開發來種茶樹。", false, "過度開發山坡地會破壞原本的森林、容易造成土石流；種經濟植物也要顧到環境保護。", R5),
    ch("k52", "1-1", "某天在公園裡，看到所有東西的影子都落在西方。大約是什麼時候？", ["早上", "中午", "下午", "傍晚"], 0, "影子在西方表示太陽在東方，那是早上。", R5, "太陽在影子的對面"),
    ch("k53", "1-3", "今天觀察到太陽從東南方升起、西南方落下。今天最可能是哪一天？", ["春分", "夏至", "秋分", "冬至"], 3, "冬至前後，太陽從東偏南升起、西偏南落下；夏至是東偏北升起；春分、秋分從正東升起。", R5, "太陽路徑最偏南的季節"),
    ch("k54", "2-1", "植物體內的水分怎麼運送？", ["根吸收、莖輸送、葉蒸散", "莖吸收、根輸送、葉蒸散", "葉吸收、莖輸送、根蒸散", "花吸收、葉輸送、根蒸散"], 0, "根從土裡吸水，莖把水往上送；葉子裡的水分變成水蒸氣，主要從葉子上的小孔（氣孔）散出去，叫做蒸散作用。", R5, "從土裡開始往上走"),
    ch("k55", "1-2", "下列哪一個「不是」光的折射造成的？", ["湖面上的倒影", "天空中的彩虹", "水中的腳看起來變短", "水杯裡的吸管像斷掉"], 0, "湖面倒影是光的反射；彩虹、腳變短、吸管像斷掉都和折射有關。", R5, "像鏡子一樣的是哪一個？"),
    ch("k56", "2-2", "玉米的花主要靠什麼幫忙授粉？", ["蝴蝶", "蜜蜂", "水", "風"], 3, "玉米的花不鮮豔、沒有香味，花粉又多又輕，靠風把花粉吹到雌蕊上。", R5, "花不漂亮、花粉很輕"),
    // 卷 6：臺北市實踐國小 112 學年
    tf("k57", "1-3", "臺灣在北回歸線附近，冬天時朝南的窗戶比較容易照到陽光。", true, "冬天太陽路徑偏南、高度角低，陽光可以斜斜的從朝南的窗戶照進屋內。", R6),
    tf("k58", "1-3", "不同季節太陽高度角的大小，會影響地面受熱的多少。", true, "高度角大時陽光比較集中照在地面，地面比較熱（夏天）；高度角小時陽光斜斜的散開，地面比較冷（冬天）。", R6),
    tf("k59", "1-2", "把放大鏡放在燭火和紙板中間，調整距離，紙板上可能出現倒立的燭火影像。", true, "放大鏡可以把光聚在紙板上，形成倒立的影像。", R6),
    ch("k60", "1-1", "住在臺中的人，每小時記錄一次竿影，連續三小時發現竿影越來越短。最可能是在哪一段時間？", ["07:00～10:00", "11:00～14:00", "13:00～16:00", "15:00～18:00"], 0, "竿影從早上到中午越來越短，中午以後越來越長。只有整段都在上午的 07:00～10:00 會一直變短。", R6, "中午以前還是以後？"),
    ch("k61", "2-1", "有些植物（例如捕蠅草）的葉子會捕捉小昆蟲，主要是因為它們生長的環境怎麼了？", ["照不到陽光", "土壤裡缺少某些養分", "沒有空氣", "莖太軟站不直"], 1, "食蟲植物常長在土壤貧瘠的地方，捕捉小蟲可以補充土壤裡缺少的養分；它們仍然會用陽光進行光合作用。", R6, "從土裡拿不到的，就從蟲身上拿"),
    ch("k62", "2-1", "買回來的蔥用掉上面一段後，把帶根的部分泡在水裡想讓它繼續長。這樣做合理嗎？", ["合理，根吸水後會把水運到其他部位", "不合理，蔥是用莖吸水的", "不合理，蔥不需要水", "合理，但一定要整根蔥都泡在水裡"], 0, "根負責吸水，水再經莖往上送。把根泡在水裡、上面露出來就可以了。", R6, "誰負責吸水？"),
    ch("k63", "2-2", "竹子平常不太開花，竹林大多是怎麼長出來的？", ["靠種子", "靠花", "靠地下的莖不斷延伸、冒出新芽", "靠葉子掉到地上"], 2, "竹子的莖在地下延伸，從地下莖長出新芽（竹筍），一大片竹林常是同一株竹子長出來的。", R6, "竹筍從哪裡冒出來？"),
    ch("k64", "1-3", "嘉義一間房子有一扇朝南、前面沒有東西遮住的窗戶。四季代表日的中午，哪一天陽光從這扇窗照進屋子裡最深？", ["春分", "夏至", "秋分", "冬至"], 3, "冬至中午太陽最低、高度角最小，陽光斜斜的照得最深；夏至中午太陽幾乎在頭頂，幾乎照不進屋裡。", R6, "太陽越低，光越斜"),
    // 卷 7：南投縣社寮國小 112 學年
    ch("k65", "1-1", "用手電筒照竿子做實驗，手電筒從竿子的右邊照過來，影子會在竿子的哪一邊？", ["右邊", "左邊", "正上方", "不會有影子"], 1, "影子在光源的相反方向，光從右邊來，影子就在左邊。", R7, "影子躲在光的對面"),
    tf("k66", "2-1", "草莓的走莖會長出新的小苗。", true, "草莓會長出細長的走莖，走莖上會長出新的小苗，這是用莖繁殖。", R7),
    tf("k67", "2-1", "榕樹的莖很軟、站不直，要纏繞別的東西往上長。", false, "榕樹的莖粗壯可以直立；榕樹特別的是氣生根，可以吸收空氣中的水分，伸到土裡還能長成支柱根。", R7),
    ch("k68", "2-1", "榕樹的氣生根向下伸進土裡、長得像樹幹，叫做什麼？", ["支柱根", "板根", "塊根", "走莖"], 0, "氣生根伸進土裡後變粗，像柱子一樣撐住大樹，叫支柱根。支柱根多了，一棵榕樹看起來就像一片樹林（獨木成林）。", R7, "像柱子一樣撐住大樹"),
    // 看圖題（照考古卷的圖型自己重畫：竿影紀錄圖、正午陽光照進屋內、花的構造標號）
    fg("k69", "1-1", "pole-day", "看圖：8 點的竿影指向哪一方？", ["東偏南", "西偏北", "正北", "正南"], 1, "早上太陽在東偏南，影子在太陽的對面，所以 8 點的影子指向西偏北。", R1, "影子在太陽的對面"),
    fg("k70", "1-1", "pole-day", "看圖：這一天哪一個時間的竿影最短？", ["8 點", "10 點", "12 點", "16 點"], 2, "中午太陽在南方、高度角最大，竿影最短，而且指向北方。", R1, "太陽越高，影子越短"),
    fg("k71", "1-1", "pole-day", "看圖：從早上到下午，竿影的尖端往哪個方向移動？", ["由東往西", "由西往東", "一直不動", "由北往南"], 1, "太陽由東往西走，影子在太陽的對面，所以竿影由西往東移動。", R1, "看 8 點和 16 點的影子各在哪一邊"),
    fg("k72", "1-3", "house-noon", "看圖：哪一條是冬至中午照進來的陽光？", ["①", "②", "③", "三條都一樣"], 1, "冬至中午太陽最低、光最斜，從窗戶照進屋內最深，就是②。", R6, "太陽越低，光照得越深"),
    fg("k73", "1-3", "house-noon", "看圖：哪一條是夏至中午照進來的陽光？", ["①", "②", "③", "三條都一樣"], 2, "夏至中午台中的太陽幾乎在頭頂，光幾乎直直往下，只照進窗邊一點點，就是③。", R6, "太陽最高的那一天"),
    fg("k74", "1-3", "house-noon", "看圖：為什麼②的陽光照進屋子裡最深？", ["那一天中午太陽最低，光最斜", "那一天中午太陽最高", "那一天太陽比較大", "那一天天氣最熱"], 0, "太陽越低（高度角越小），光越斜，就能從窗戶照到屋子越裡面。", R6, "看光線斜不斜"),
    fg("k75", "2-2", "flower-parts", "看圖：①是花的哪一個部位？", ["柱頭", "花藥", "子房", "胚珠"], 0, "雌蕊最上面、用來接住花粉的部位是柱頭。", R1, "雌蕊最上面"),

    ch("q71", "1-3", "四季代表日中，哪兩天日出的位置差不多相同？", ["春分、夏至", "春分、秋分", "秋分、冬至", "夏至、冬至"], 1, "春分和秋分都從正東升起。", A),
    ch("q72", "1-3", "四季代表日中，哪兩天太陽在天空中走的路線差不多相同？", ["春分、夏至", "夏至、秋分", "春分、秋分", "夏至、冬至"], 2, "春分和秋分太陽都直射赤道，走的路線差不多。", A),
    ch("q73", "1-2", "什麼時候最有可能在天空中看到彩虹？", ["颱風來襲、狂風暴雨的時候", "雲很厚、看不到太陽的時候", "停電的晚上", "剛下過雨、出太陽的時候"], 3, "雨後空氣中還有小水滴，太陽一出來，背對太陽就可能看到彩虹。", A),

    /* ---------- 安親班複習卷：植物世界 ---------- */
    ch("p1", "2-2", "關於植物的繁殖，哪一句正確？", ["植物只能靠種子繁殖", "一種植物可能有好幾種繁殖方式", "所有植物都靠根和種子繁殖"], 1, "例如地瓜可以用種子，也可以用塊根繁殖；繁殖方式不只一種。", P),
    ch("p2", "2-1", "植物進行光合作用時，會產生哪些東西？", ["氧氣和養分", "光線和水", "二氧化碳和光線", "只有水"], 0, "葉子利用陽光進行光合作用，製造養分，同時放出氧氣。", P),
    ch("p3", "2-2", "下列哪一個「不是」植物的繁殖器官？", ["種子", "花", "葉", "果實"], 2, "花、果實、種子是繁殖器官；根、莖、葉是營養器官。", P),
    tf("p4", "2-1", "含羞草受到刺激後，葉片會閉合、葉柄會下垂。", true, "含羞草被碰到時，葉片很快合起來、葉柄垂下。", P),
    tf("p5", "2-1", "槭葉牽牛的莖可以纏繞在其他物體上往上長。", true, "槭葉牽牛是纏繞莖，莖柔軟，要纏著別的東西往上長。", P),
    tf("p6", "2-1", "馬鈴薯有短而膨大的塊莖，可以儲藏養分。", true, "我們吃的馬鈴薯就是膨大的塊莖，裡面存了很多養分。", P),
    tf("p7", "2-1", "榕樹的氣生根可以吸收空氣中的水分。", true, "榕樹從枝幹垂下來的氣生根可以吸收空氣中的水分，長到地面後還能支持樹。", P),
    tf("p8", "2-1", "捕蠅草的葉子像夾子，可以誘捕昆蟲。", true, "捕蠅草的葉子會像夾子一樣合起來，把昆蟲夾住。", P),
    tf("p9", "2-1", "仙人掌細長的針狀葉，可以讓蒸散作用變快。", false, "針狀葉可以減少水分散失，讓蒸散變慢，適合乾燥的環境。", P),
    ch("p10", "2-1", "銀葉樹的「板根」是什麼樣子、有什麼用？", ["細細長長像鬍鬚，用來吸收空氣中的水分", "突出地面像三角形的翅膀，增加抓地面積讓樹站穩", "長在葉子上，用來繁殖", "藏在土裡，用來儲存養分"], 1, "板根突出地面，呈翼狀三角形，可以增加抓地的面積，讓植物穩穩站著。", P),
    ch("p11", "2-1", "下列哪一種植物的莖柔軟、不能直立，要攀附在其他東西上往上長？", ["樟樹", "榕樹", "絲瓜", "鳳凰木"], 2, "絲瓜的莖柔軟，用捲鬚攀附別的東西往上長；槭葉牽牛也是莖柔軟、要纏繞別的東西。", P),
    ch("p12", "2-3", "下列哪一種主要是給人們食用的經濟植物？", ["蘭花", "鳳梨釋迦", "聖誕紅", "銀葉樹"], 1, "鳳梨釋迦、芒果是吃的；蘭花、聖誕紅主要是觀賞用。", P),
    tf("p13", "2-3", "經濟植物就是價格非常高昂的植物。", false, "經濟植物是對人們生活或收入有幫助的植物，不一定很貴。", P),
    tf("p14", "2-3", "經濟植物可以為農民帶來收入。", true, "經濟植物可以賣錢、增加收入。", P),
    tf("p15", "2-3", "人們會透過品種改良，讓經濟植物更有價值。", true, "品種改良可以培育新品種、讓產量更穩定、加快繁殖。", P),
    tf("p16", "2-3", "只有能觀賞的植物，才算是經濟植物。", false, "食用、做材料、觀賞……對人有用的都算經濟植物。", P),
    tf("p17", "2-3", "魔鬼氈的靈感來自蒲公英的白色細毛。", false, "魔鬼氈是模仿大花咸豐草果實上的倒鉤刺。", P),
    tf("p18", "2-3", "魔鬼氈上有許多小倒鉤。", true, "魔鬼氈一面有很多小倒鉤，另一面是小圈圈，壓在一起就黏住。", P),
    tf("p19", "2-3", "魔鬼氈是學習生物的構造、讓生活更方便的例子（仿生）。", true, "模仿生物的構造來發明東西，叫做仿生。", P),
    tf("p20", "2-2", "種子通常在果實裡，是由花瓣發育而成的。", false, "種子是由子房裡的胚珠發育而成的；花瓣通常會凋謝。", P),
    tf("p21", "2-2", "花萼有保護花朵的作用。", true, "花萼在花的最外面，花還是花苞時可以保護它。", P),
    tf("p22", "2-2", "不同種類的植物，花的樣子可能不一樣。", true, "不同植物的花，大小、顏色、形狀都可能不同。", P),
    tf("p23", "2-1", "葉子的主要功能之一，是吸收土裡的水分。", false, "吸收土裡的水分是根的工作。", P),
    tf("p24", "2-1", "葉子可以吸收陽光進行光合作用，製造植物需要的養分。", true, "葉子是植物製造養分的地方。", P),
    tf("p25", "2-1", "植物多餘的水分，會從葉子蒸散出去。", true, "水從葉子散失到空氣中，叫做蒸散作用。", P),
    tf("p26", "2-1", "葉子的主要功能，是把水分和養分運送到植物全身。", false, "運送水分和養分是莖的工作。", P),
    tf("p27", "2-2", "玉米可以靠風來傳播花粉。", true, "玉米的花粉又輕又多，靠風吹到別的花上。", P),
    tf("p28", "2-1", "用夾鏈袋包住陽光下的葉子，袋子裡出現小水珠，是因為葉子會吸收水分。", false, "小水珠是葉子蒸散出來的水，不是葉子在吸水。", P),
    tf("p29", "2-2", "花的雄蕊包含花藥和花絲。", true, "雄蕊上端是花藥（裡面有花粉），下面細長的是花絲。", P),
    tf("p30", "2-2", "植物授粉後，胚珠會慢慢發育成種子。", true, "授粉後，子房發育成果實，胚珠發育成種子。", P),
    tf("p31", "2-2", "椰子的果實靠風飄到遠處繁殖。", false, "椰子的果實可以浮在水上，隨著水漂到遠處。", P),
    tf("p32", "2-1", "在陽光下用夾鏈袋包住葉子，一段時間後，袋子裡會出現許多小水珠。", true, "這是葉子蒸散出來的水分。", P),
    tf("p33", "2-3", "我們吃的白蘿蔔是植物的莖，莖上面長著葉子。", false, "白蘿蔔是植物的根。", P),
    tf("p34", "2-2", "果實是由花的子房發育而成，種子則由子房裡的胚珠發育而成。", true, "子房→果實，胚珠→種子。", P),
    tf("p35", "2-2", "有些植物可以用種子以外的構造繁殖。", true, "例如落地生根用葉、馬鈴薯用莖、地瓜用根。", P),
    tf("p36", "2-1", "所有植物的根一定都長在土裡。", false, "像榕樹的氣生根就長在空氣中。", P),
    tf("p37", "2-1", "長在土壤裡的根，可以固定植物。", true, "根把植物抓牢，也吸收水分。", P),
    tf("p38", "2-1", "馬鈴薯的莖非常柔軟，可以纏繞在其他東西上。", false, "馬鈴薯的塊莖是短而膨大、用來儲存養分的，不會纏繞。", P),
    tf("p39", "2-1", "植物生長在不同的環境，根、莖、葉的樣子都一模一樣。", false, "植物會長出適合環境的構造，例如仙人掌的針狀葉、銀葉樹的板根。", P),
    tf("p40", "2-2", "有些果實長著薄薄的翅膀，可以靠風散播種子。", true, "例如青楓的果實有薄翅，會被風吹著轉圈飛走。", P),
    tf("p41", "2-2", "花粉傳到雌蕊後，花粉和胚珠結合，胚珠就能發育成種子。", true, "授粉後，胚珠會發育成種子。", P),
    tf("p42", "2-2", "許多植物的種子被保護在果實裡。", true, "果實包著種子，保護種子，也幫忙散播。", P),
    tf("p43", "2-2", "所有植物都只靠風來散播果實和種子。", false, "還有靠水、靠動物、靠彈力散播的。", P),
    tf("p44", "2-2", "非洲鳳仙花的果實成熟後會裂開，用彈力把種子彈出去。", true, "這是靠彈力散播種子。", P),
    tf("p45", "2-2", "蒲公英的果實長有細毛，可以靠風飄到適合生長的地方。", true, "細毛像降落傘，讓果實被風吹走。", P),
    tf("p46", "2-2", "把番薯（地瓜）的塊根種在土裡，可以長出新植物。", true, "地瓜是塊根，可以用來繁殖。", P),
    tf("p47", "2-2", "花、果實和種子都屬於植物的「器官」。", true, "花、果實、種子是繁殖器官；根、莖、葉是營養器官。", P),
    tf("p48", "2-1", "銀葉樹的板根突出地面、像三角形的翅膀，可以增加抓地面積。", true, "板根讓銀葉樹站得更穩。", P),
    tf("p49", "2-1", "鳳凰木和銀葉樹都是有板根的植物。", true, "鳳凰木和銀葉樹的樹幹基部都可以長出突出地面的板根。", P),
    tf("p50", "2-1", "毛氈苔的葉子上有會分泌黏液的觸毛，可以捕捉昆蟲。", true, "昆蟲被黏液黏住後，就被毛氈苔捕捉。", P),
    tf("p51", "2-3", "臺灣最有國際競爭力、外銷世界各地的經濟植物是小麥。", false, "臺灣外銷有名的是蘭花、茶葉、芒果等；小麥大多是進口的。", P),
    tf("p52", "2-3", "經濟植物通常不容易繁殖，生活中幾乎看不到。", false, "經濟植物大多容易栽培，生活中到處都看得到。", P),
    tf("p53", "2-3", "魔鬼氈的設計，是參考桃花心木種子的薄翅。", false, "魔鬼氈是參考大花咸豐草果實的倒鉤刺。", P),
    tf("p54", "2-2", "黃花酢漿草的果實成熟後，可以把種子彈出去。", true, "這是靠彈力散播種子。", P),
    tf("p55", "2-2", "把黃金葛放在適合的環境，莖上的節可能長出葉子和根。", true, "黃金葛可以用莖繁殖（扦插）。", P),
    ch("p56", "2-2", "雄蕊的花粉傳到雌蕊上的過程叫什麼？", ["蒸散作用", "授粉", "蒸發", "毛細現象"], 1, "花粉傳到雌蕊柱頭上叫做授粉。", P),
    ch("p57", "2-1", "在陽光下用夾鏈袋包住植物的葉子，一段時間後袋內會出現什麼？", ["種子", "綠色的汁液", "小水珠", "紅墨水"], 2, "葉子蒸散出來的水，會在袋子裡變成小水珠。", P),
    ch("p58", "2-1", "捕蠅草像夾子一樣的葉子有什麼功能？", ["增加水分散失", "減少水分散失", "誘捕昆蟲", "儲存養分"], 2, "捕蠅草用夾子一樣的葉子抓昆蟲。", P),
    ch("p61", "2-1", "把植物的根泡在紅色的水裡，一段時間後切開莖，看到一條一條紅色細絲，表示莖有什麼功能？", ["運輸水分", "排出水分", "蒸散水分", "吸收水分"], 0, "紅色的水沿著莖裡的管子往上送，表示莖可以運輸水分。", P),
    ch("p63", "2-2", "花朵授粉之後，胚珠和花粉結合會發育成什麼？", ["果肉", "種子", "果皮", "雄蕊"], 1, "胚珠發育成種子。", P),
    ch("p64", "2-2", "蒲公英的果實為什麼可以靠風傳播？", ["長有細毛", "可以浮在水面", "長有倒鉤", "長有薄翅"], 0, "細毛像降落傘，可以讓果實被風吹走。", P),
    ch("p65", "2-1", "馬鈴薯的莖（塊莖）通常不會做哪一件事？", ["儲藏養分", "長出新植物（繁殖）", "結種子", "運輸水分"], 2, "種子是花的胚珠長成的，莖不會結種子。", P),
    ch("p66", "2-2", "木瓜的果實多肉多汁，它用什麼方法散播種子？", ["附著在動物身上", "利用彈力", "隨風飄散", "吸引動物來吃，種子隨糞便散播"], 3, "動物吃了果實，種子會隨著糞便帶到別的地方。", P),
    ch("p67", "2-2", "芒果的果實，是由芒果花的哪個構造發育而成的？", ["花藥", "子房", "胚珠", "柱頭"], 1, "果實是子房發育成的；胚珠發育成種子。", P),
    ch("p68", "2-1", "植物進行光合作用的目的是什麼？", ["照亮周圍", "製造需要的養分", "減少空氣汙染", "增加土裡的水分"], 1, "光合作用是植物用陽光製造養分。", P),
    ch("p69", "2-2", "下列哪一個通常「不是」營養器官？", ["根", "莖", "葉", "花"], 3, "根、莖、葉是營養器官；花是繁殖器官。", P),
    ch("p70", "2-2", "下列哪一組都是植物的繁殖器官？", ["根、莖、葉", "花、果實、種子", "只有花", "只有根"], 1, "花、果實、種子是繁殖器官。", P),
    ch("p71", "2-2", "下列哪一項通常「不是」營養器官（根、莖、葉）的功能？", ["吸收水分", "運輸水分", "製造養分", "繁衍後代"], 3, "繁衍後代主要是花、果實、種子（繁殖器官）的工作。", P),
    ch("p72", "2-1", "哪一種植物有「走莖」，走莖前端可以長出新的小苗？", ["榕樹", "樟樹", "吊蘭", "石蓮"], 2, "吊蘭的走莖伸出去，前端會長出小吊蘭。", P),
    ch("p73", "2-1", "含羞草的葉子有什麼特色？", ["像瓶子，裡面有蜜露吸引昆蟲", "像針一樣，可以減少水分散失", "受到刺激時葉片會閉合、葉柄會下垂", "葉子上有很多會分泌黏液的細毛"], 2, "含羞草被碰到，葉片合起來、葉柄垂下。", P),
    ch("p74", "2-2", "哪一種植物有鮮豔的紅色葉子，可以吸引昆蟲來幫忙傳播花粉？", ["石蓮", "聖誕紅", "仙人掌", "含羞草"], 1, "聖誕紅紅色的部分其實是葉子，可以吸引昆蟲；中間小小黃黃的才是花。", P),
    ch("p75", "2-1", "植物的哪一個構造會進行蒸散作用，也會製造養分？", ["種子", "根", "莖", "葉"], 3, "葉子會蒸散水分，也會製造養分。", P),
    ch("p76", "2-1", "樟樹的莖有哪些功能？", ["支持身體、運輸水分和養分", "只負責繁殖後代", "只負責儲存種子", "製造花粉"], 0, "莖可以支持植物，並運輸水分和養分。", P),
    ch("p77", "2-1", "植物的根通常「沒有」哪一種功能？", ["固定植物", "吸收土裡的水分", "吸收水中的礦物質", "進行光合作用"], 3, "光合作用主要在葉子進行，根長在土裡照不到陽光。", P),

var memoryOnly = false;
function makeStorage(){
  var ls=null; try{ls=window.localStorage;}catch(e){ls=null;}
  if(ls){
    var canWrite=true; try{ls.setItem("g5sci.probe","1");ls.removeItem("g5sci.probe");}catch(e){canWrite=false;}
    if(canWrite) return ls;
    var hasData=true; try{hasData=ls.getItem("g5sci.v3")!==null||ls.getItem("g5sci.v1")!==null;}catch(e){hasData=true;}
    if(hasData) return ls;   // 有舊紀錄就不換成空白：照常讀，寫入失敗由 store 擋下並提示
  }
  memoryOnly=true; var m={};
  return {getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);}};
}
var store = C.createStore({storage:makeStorage(), bank:BANK, clock:function(){return Date.now();}});

var actx=null;
function chime(){
  if(!S().settings.sound) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [660,880].forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*0.12;o.frequency.value=f;o.type="sine";
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.3);});
  }catch(e){}
}

/* ---------- 天空場景：太陽放在今天台中的實際位置 ---------- */
// 天空場景帶：面向南方看（左東、右西），太陽畫在今天台中此刻的位置（晚上換成月亮）
function drawSky(){
  var el=$("#sky"), W=Math.max(300,Math.round(el.getBoundingClientRect().width||820)), H=132, base=104, x0=40, x1=W-40;
  var tn=tpeNow(), now=tn.date, hour=tn.hour;
  var st=sunTimes(now,TAICHUNG.lat,TAICHUNG.lon,TAICHUNG.tz), rise=st.rise||6, set=st.set||18;
  var f=(hour-rise)/(set-rise), up=f>=0&&f<=1, ff=Math.max(0,Math.min(1,f)), peak=86;
  var x=x0+(x1-x0)*ff, y=base-Math.sin(Math.PI*ff)*peak;
  el.setAttribute("viewBox","0 0 "+W+" "+H);
  var s='<rect width="'+W+'" height="'+H+'" fill="var(--sky1)"/><rect y="'+base+'" width="'+W+'" height="'+(H-base)+'" fill="var(--grass)"/>'+
    '<path d="M'+x0+' '+base+' C'+(x0+(x1-x0)*0.12)+' '+(base-peak*1.33)+' '+(x1-(x1-x0)*0.12)+' '+(base-peak*1.33)+' '+x1+' '+base+'" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 9" opacity=".9"/>';
  if(up) s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="26" fill="var(--sunball)" opacity=".25"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="17" fill="var(--sunball)"/>';
  else s+='<circle cx="'+(W-70)+'" cy="34" r="15" fill="#f4f1dc"/><circle cx="'+(W-62)+'" cy="29" r="13" fill="var(--sky1)"/>';
  s+='<text x="'+(x0-8)+'" y="'+(base+21)+'" font-size="16" fill="var(--ink)">東</text><text x="'+(x1+8)+'" y="'+(base+21)+'" font-size="16" text-anchor="end" fill="var(--ink)">西</text>'+
    '<text x="'+(W/2)+'" y="'+(base+21)+'" font-size="13" text-anchor="middle" fill="var(--ink)" opacity=".75">'+(W>=620?'面向南方看：太陽從東邊升起、經過南方天空、從西邊落下':'面向南方看')+'</text>';
  el.innerHTML=s;
}
window.addEventListener("resize",function(){drawSky();});

  var cont=inRound?'<div class="row" style="justify-content:center"><button class="btn" type="button" id="goOn">繼續這一輪（還有 '+se.queue.length+' 張）</button></div>':'';
  if(!v.planIds.length){
    h='<div class="done"><b class="t">今天沒有排定卡片</b><p class="muted" style="margin:0">可以點下面的觀念看圖解、去實驗室玩，或「考考爸媽」。</p>'+cont+'<div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="goTeach">考考爸媽</button></div></div>';
  }else if(v.completed){
    h='<div class="done"><b class="t">今天的卡片都做完了</b><p class="muted" style="margin:0">今天 '+v.M.cardProgress.planned+' 張全部完成。想加碼可以去實驗室、考考爸媽'+(se&&se.wrong.length?'，或再練答錯的卡':'')+'。</p>'+cont+
      '<div class="row" style="justify-content:center">'+(se&&se.wrong.length?'<button class="btn ghost" type="button" id="goRedo">再練答錯的 '+se.wrong.length+' 張</button>':'')+'<button class="btn ghost" type="button" id="goTeach">考考爸媽</button></div></div>';
  }else{
    var due=v.planIds.filter(function(id){return C.cardState(S(),id).seen>0;}).length, fresh=v.planIds.length-due;
    var parts=[]; if(due) parts.push("到期複習 "+due+" 張"); if(fresh) parts.push("新卡 "+fresh+" 張"); if(v.doneIds.length) parts.push("已做 "+v.doneIds.length+" 張");
    h='<div class="today"><div class="big"><b>'+Math.max(0,C.diffDays(v.today,EXAM))+'</b><span class="muted small">天後考試</span></div><div style="display:grid;gap:10px">'+
      '<div style="font-size:23px;font-weight:700">'+(v.doneIds.length?'今天還有 '+left+' 張':'今天要練 '+left+' 張')+'</div>'+
      '<div class="muted">'+parts.join("、")+'。答錯可以看圖解、進實驗室弄懂。</div>'+
      '<div class="row">'+(inRound?'<button class="btn" type="button" id="goOn">繼續這一輪（還有 '+se.queue.length+' 張）</button>':'<button class="btn" type="button" id="goAll">開始今天的練習</button>')+
      (!inRound&&left>3?'<button class="btn ghost" type="button" id="goLight">今天有點累，只做 3 張</button>':'')+'</div></div></div>';
  }
  el.innerHTML=h+reviewRow();
  wireReview(el);
  on("#goAll",function(){beginRound({type:"sessionStart"});});
  on("#goLight",function(){beginRound({type:"sessionStart",size:3});});
  on("#goOn",startRound);
  on("#goTeach",function(){renderTeach();});
  on("#goRedo",function(){var w=V().session.wrong.slice();beginRound({type:"sessionStart",kind:"redo",ids:w});});
  renderSide();
}
// 小考複習：把整個單元（或一個觀念）排成一輪；作答照規則記分、隔天照樣複習，不改今天的計畫
function unitCards(unit){return C.allCards(S(),BANK).filter(function(c){return CONCEPTS[c.concept].unit===unit&&conceptOn(c.concept);}).map(function(c){return c.id;});}
function setCards(unit){return C.allCards(S(),BANK).filter(function(c){return c.set==="anqin"&&CONCEPTS[c.concept].unit===unit&&conceptOn(c.concept);}).map(function(c){return c.id;});}
function reviewRow(){
  var units=Object.keys(UNITS).filter(function(u){return unitCards(u).length;});
  var sets=Object.keys(UNITS).filter(function(u){return setCards(u).length;});
  return '<div style="display:grid;gap:8px;border-top:1px solid var(--line-soft);padding-top:14px"><div style="font-weight:700">小考前想全部練一次</div><div class="row">'+
    units.map(function(u){return '<button class="btn ghost sm" type="button" data-unit="'+u+'">第'+["","一","二","三"][+u]+'單元 '+esc(UNITS[u].replace(/^.、/,""))+'（'+unitCards(u).length+' 題）</button>';}).join("")+'</div>'+
    (sets.length?'<div class="row">'+sets.map(function(u){return '<button class="btn ghost sm" type="button" data-set="'+u+'">安親班複習卷：'+esc(UNITS[u].replace(/^.、/,""))+'（'+setCards(u).length+' 題）</button>';}).join("")+'</div>':'')+
    '<span class="small muted">每題照樣記分、隔天照樣複習，不影響今天的計畫。</span></div>';
}
function wireReview(el){
  el.querySelectorAll("button[data-unit]").forEach(function(b){b.onclick=function(){beginRound({type:"sessionStart",kind:"review",ids:unitCards(b.dataset.unit)});};});
  el.querySelectorAll("button[data-set]").forEach(function(b){b.onclick=function(){beginRound({type:"sessionStart",kind:"review",ids:setCards(b.dataset.set)});};});
}
// 開始一輪：sessionStart 真的存進去才進練習畫面；沒存到就留在原畫面（提示列會出現「再存一次」）
function beginRound(a){var r=act(a);if(r.ok)startRound();return r;}
function startRound(){screen="practice";route();window.scrollTo({top:$("#main").offsetTop-8,behavior:"smooth"});}
function renderConcepts(){
  var v=V();
  $("#conceptTitle").textContent=["","一","二","三","四","五","六","七","八","九","十"][CIDS.length]+"個觀念（點一下看圖解、做實驗）";
  $("#concepts").innerHTML=CIDS.map(function(cid){
    var c=CONCEPTS[cid], ok=conceptOn(cid), st=v.stages[cid];
    var dueN=v.remainingIds.filter(function(id){var k=card(id);return k&&k.concept===cid;}).length;
    var help=v.needsHelp.indexOf(cid)>=0;
    return '<button type="button" class="ccard '+c.tone+(ok?'':' off')+(help?' help':'')+'" data-cid="'+cid+'"'+(ok?'':' aria-disabled="true"')+'>'+ICON[cid]+'<b>'+esc(c.short)+'</b>'+
      (ok?'<span class="st">'+(st?STAGE[st]:'種子・還沒練')+'</span><span class="due">'+(help?'等爸媽陪著看':dueN?'今天有 '+dueN+' 張':'今天沒有排到')+'</span>':'<span class="due">老師教完再開放</span>')+'</button>';
  }).join("");
  document.querySelectorAll("#concepts .ccard").forEach(function(b){b.onclick=function(){
    var cid=b.dataset.cid;
    if(!conceptOn(cid)){toast("老師教完溶解以後，到「設定與題庫」打勾，隔天就會開放。");return;}
    renderConcept(cid);
  };});
}
function renderCal(){
  var s=S(), v=V(), cells=[], k=START;
  while(k<=EXAM){
    var d=s.days[k], cls=(d&&d.touched.length)?"on":"";
    if(k===v.today) cls+=" today"; if(k===EXAM) cls+=" exam";
    cells.push('<i class="'+cls+'" title="'+md(k)+'">'+(k===EXAM?"考":(+k.slice(8,10)))+'</i>');
    k=C.addDays(k,1);
  }
  $("#cal").innerHTML=cells.join("");
  var n=0; k=v.today;
  if(!(s.days[k]&&s.days[k].touched.length)) k=C.addDays(k,-1);
  while(s.days[k]&&s.days[k].touched.length){n++;k=C.addDays(k,-1);}
  $("#streak").textContent=n?("連續練習 "+n+" 天"):"今天做 1 張就開始累積天數";
}
function toast(t){var el=$("#main"),d=document.createElement("div");d.className="hint";d.textContent=t;el.prepend(d);setTimeout(function(){d.remove();},3500);}

/* ---------- 觀念頁（概念入口） ---------- */
function conceptCards(cid){return C.allCards(S(),BANK).filter(function(c){return c.concept===cid;}).map(function(c){return c.id;});}
function renderConcept(cid){
  screen="concept"; leaveLab();
  var c=CONCEPTS[cid], v=V(), ex=EXPLAIN[cid][0];
  var mine=v.remainingIds.filter(function(id){var k=card(id);return k&&k.concept===cid;}).length, stuck=v.needsHelp.indexOf(cid)>=0;
  var el=$("#main");
  el.innerHTML='<div style="display:grid;gap:14px"><div class="qhead"><span>'+esc(UNITS[c.unit])+'</span><span>'+STAGE[v.stages[cid]]+'</span></div><h2>'+esc(c.title)+'</h2>'+
    (stuck?'<div class="banner info"><strong>這個觀念先和爸媽一起看圖解</strong><span class="small">爸媽在「家長摘要」按「已經陪她看過」以後，再來練這個觀念的題目。</span></div>':'')+
    explainBlock(ex)+
    '<div class="row"><button class="btn" type="button" id="cLab">去實驗室動手做</button>'+(mine&&!v.completed&&!stuck?'<button class="btn ghost" type="button" id="cFocus">先練這個觀念（今天 '+mine+' 張）</button>':'')+
    (stuck?'':'<button class="btn ghost" type="button" id="cAll">練這個觀念的全部 '+conceptCards(cid).length+' 題</button>')+
    '<button class="btn ghost" type="button" id="cMore">換另一種說法</button><button class="btn ghost sm" type="button" id="cBack">回首頁</button></div></div>';
  on("#cLab",function(){openLab(cid,{from:"menu"});});
  on("#cFocus",function(){beginRound({type:"sessionStart",focus:cid});});
  on("#cAll",function(){beginRound({type:"sessionStart",kind:"review",ids:conceptCards(cid)});});
  on("#cMore",function(){var b=$("#main .remedy");if(b)b.outerHTML=explainBlock(EXPLAIN[cid][1]);$("#cMore").hidden=true;});
  on("#cBack",renderHome);
  el.scrollIntoView({behavior:"smooth",block:"start"});
}
function askLine(ex){return '<div class="hint"><strong>給爸媽：</strong>先讓她說，不直接報答案。可以追問：「'+esc(ex.ask)+'」</div>';}
function explainBlock(ex){
  return '<div class="remedy"><strong style="font-size:19px">'+esc(ex.name)+'</strong>'+ex.svg()+'<ul>'+ex.lines.map(function(t){return '<li>'+esc(t)+'</li>';}).join("")+'</ul>'+askLine(ex)+'</div>';
}

/* ---------- 題目（練習與考考爸媽共用同一個 renderer） ---------- */
function figureSvg(kind,annotated){
  if(window.G5_FIGS&&G5_FIGS.kinds[kind]) return G5_FIGS.kinds[kind](annotated);   // 自己重畫的考古卷看圖題（src/figs.js）
  var am=kind==="sun-am", sunX=am?70:290, sunY=24, topY=90, baseY=130;   // 面向南方：東在左、西在右
  var tipX=180+(180-sunX)*(baseY-topY)/(topY-sunY);
  var s='<figure style="margin:0"><svg class="fig" data-fig="'+kind+'" viewBox="0 0 360 170" role="img" aria-label="'+(am?"早上太陽在東邊":"下午太陽在西邊")+'，地上有一根竿子">'+
    '<rect width="360" height="170" rx="12" fill="var(--sky1)"/><line x1="10" y1="'+baseY+'" x2="350" y2="'+baseY+'" stroke="var(--muted)" stroke-width="2"/>'+
    '<circle cx="'+sunX+'" cy="'+sunY+'" r="18" fill="var(--sunball)"/><text x="'+sunX+'" y="'+(sunY+36)+'" text-anchor="middle" font-size="14" fill="var(--ink)">太陽</text>';
  if(annotated){
    s+='<line x1="'+sunX+'" y1="'+sunY+'" x2="'+tipX.toFixed(1)+'" y2="'+baseY+'" stroke="var(--sun)" stroke-width="2" stroke-dasharray="6 4"/>'+
      '<line x1="180" y1="'+baseY+'" x2="'+tipX.toFixed(1)+'" y2="'+baseY+'" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" opacity=".5"/>'+
      '<text class="ans-mark" x="'+((180+tipX)/2).toFixed(1)+'" y="'+(baseY-10)+'" text-anchor="middle" font-size="14" fill="var(--ink)">影子</text>';
  }
  s+='<line x1="180" y1="'+baseY+'" x2="180" y2="'+topY+'" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>'+
    '<text x="20" y="155" font-size="16" fill="var(--ink)">東</text><text x="340" y="155" text-anchor="end" font-size="16" fill="var(--ink)">西</text>'+
    '<text x="180" y="155" text-anchor="middle" font-size="14" fill="var(--muted)">竿子</text><text x="350" y="18" text-anchor="end" font-size="11" fill="var(--muted)">面向南方看</text></svg>'+
    (annotated?'<figcaption class="small">太陽在'+(am?"東":"西")+'，光直直照過來被竿子擋住，影子就落在相反的'+(am?"西":"東")+'邊。</figcaption>':'')+'</figure>';
  return s;
}
// mode: practice｜teach。teach 只畫題目與選項，不畫作答鈕；兩者的題圖完全相同（作答前不畫影子，免得洩題）
function questionHtml(c,mode){
  var h="";
  if(c.type==="figure") h+=figureSvg(c.fig,false);
  if(c.type==="map"){
    h+='<div class="q">'+esc(c.q)+'</div><div class="map"><div class="center">'+esc(c.center)+'</div><div class="branches">'+
      c.branches.map(function(b,i){return '<div class="branch"><b>'+esc(b.k)+'</b><span>'+esc(b.show)+'</span>'+(mode==="teach"?'<span class="muted">？</span>':'<button class="blank" type="button" data-i="'+i+'">？ 點我看答案</button>')+'</div>';}).join("")+'</div></div>';
    return h;
  }
  h+='<div class="q">'+esc(c.q)+'</div>';
  if(c.type==="choice"||c.type==="figure"){
    if(mode==="teach") h+='<ol style="margin:0;font-size:19px">'+c.opts.map(function(o){return '<li>'+esc(o)+'</li>';}).join("")+'</ol>';
    else h+='<div class="opts">'+c.opts.map(function(o,i){return '<button class="opt" type="button" data-i="'+i+'">'+esc(o)+'</button>';}).join("")+'</div>';
  }
  return h;
}
function answerText(c){return c.type==="recall"?c.ans:c.type==="map"?c.branches.map(function(b){return b.k+"："+b.blank;}).join("、"):c.opts[c.a];}

/* ---------- 練習 ---------- */
var ui={hint:false,cardId:null};
function renderPractice(){
  screen="practice"; leaveLab();
  var v=V(), se=v.session, el=$("#main");
  if(!se||!se.queue.length||se.halted) return renderEnd();
  var id=se.queue[0], c=card(id);
  if(!c) return renderEnd();
  ui={hint:false,cardId:id,variation:se.kinds[id]==="variation"};
  var con=CONCEPTS[c.concept], total=se.answered.length+se.queue.length, pos=se.answered.length+1;
  var h='<div class="qhead"><span>'+(se.kind==="review"?'<span class="tag" style="margin:0 6px 0 0">小考複習</span>':'')+esc(UNITS[con.unit])+'・'+esc(con.title)+(ui.variation?'<span class="tag">同觀念換一題確認</span>':'')+'</span><span>'+pos+' / '+total+'</span></div><div class="bar"><i style="width:'+Math.round((pos-1)/total*100)+'%"></i></div>';
  h+=questionHtml(c,"practice");
  var tools='<div class="tools"><label><input type="checkbox" id="unsure"> 我不太確定</label>'+(c.hint?'<button class="btn ghost sm" type="button" id="hintBtn">給我一點提示</button>':'')+'</div><div class="hint" id="hintBox" hidden></div>';
  if(c.type==="map"){
    h+='<div id="ansBox"><div class="row" id="grade" hidden><button class="btn" type="button" data-g="1">我全部想出來了</button><button class="btn ghost" type="button" data-g="0">有想不出來的</button></div></div>';
    el.innerHTML=h;
    var shown=0;
    el.querySelectorAll(".blank").forEach(function(b){b.onclick=function(){if(b.classList.contains("shown"))return;b.classList.add("shown");b.textContent=c.branches[+b.dataset.i].blank;shown++;if(shown===c.branches.length)$("#grade").hidden=false;};});
    el.querySelectorAll("#grade button").forEach(function(b){b.onclick=function(){el.querySelectorAll("#grade button").forEach(function(x){x.disabled=true;});submit(c,b.dataset.g==="1",{});};});
    return;
  }
  if(c.type==="recall"){
    h+='<p class="muted" style="margin:0">先在心裡（或說出來）回答，再看答案。</p>'+tools+'<div class="row" id="revealRow"><button class="btn" id="reveal" type="button">想好了，看答案</button></div><div id="ansBox"></div>';
    el.innerHTML=h; wireTools(c);
    on("#reveal",function(){
      $("#revealRow").hidden=true;
      $("#ansBox").innerHTML='<div class="fb ok"><strong>答案：'+esc(c.ans)+'</strong><span>'+esc(c.why||"")+'</span>'+srcLine(c)+'</div><div class="row" id="selfGrade" style="margin-top:10px"><button class="btn" type="button" data-g="1">我答對了</button><button class="btn ghost" type="button" data-g="0">我答錯了</button></div>';
      $("#selfGrade").querySelectorAll("button").forEach(function(b){b.onclick=function(){$("#selfGrade").querySelectorAll("button").forEach(function(x){x.disabled=true;});submit(c,b.dataset.g==="1",meta(),true);};});
    });
    return;
  }
  h+=tools+'<div id="ansBox"></div>';
  el.innerHTML=h; wireTools(c);
  el.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.i, ok=i===c.a;
    el.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(+x.dataset.i===c.a)x.classList.add("right");});
    if(!ok) b.classList.add("wrong");
    submit(c,ok,meta());
  };});
}
function wireTools(c){
  on("#hintBtn",function(){ui.hint=true;this.disabled=true;var box=$("#hintBox");box.hidden=false;box.textContent="提示："+c.hint;});
}
function meta(){var u=$("#unsure");return {unsure:!!(u&&u.checked),hint:ui.hint};}
var pending=null;
function submit(c,ok,m,selfGraded){
  var a={type:"answer",id:newId(),cardId:c.id,ok:ok,hint:!!m.hint,unsure:!!m.unsure,variation:!!ui.variation};
  var r=act(a);
  if(!r.ok&&!r.dup&&r.error==="SAVE_PENDING"){
    $("#ansBox").insertAdjacentHTML("beforeend",'<div class="fb no" id="saveFail"><strong>上一步還沒存到這台裝置，這一題先不算</strong><span class="small">按上方的「再存一次」，存好以後再作答這一題。</span></div>');
    setTimeout(renderPractice,1600);
    return;
  }
  pending={a:a,c:c,ok:ok,m:m,selfGraded:selfGraded};
  if(!r.ok&&!r.dup){
    $("#ansBox").insertAdjacentHTML("beforeend",'<div class="fb no" id="saveFail"><strong>這一題還沒存到這台裝置</strong><div class="row"><button class="btn sm" type="button" id="saveAgain">再存一次</button></div></div>');
    on("#saveAgain",retrySave);
    return;
  }
  feedback(pending,r.info||{});
}
// 兩個「再存一次」（上方提示列、題目下方）走同一條路：存成功才公布回饋
function retrySave(){
  var rr=store.retry(); banners();
  var f=$("#saveFail");
  if(f&&pending){ if(store.accepted(pending.a.id)){f.remove();feedback(pending,(rr&&rr.info)||{});} return; }
  if(rr.ok) route();
}
function feedback(p,info){
  var c=p.c, ok=p.ok, shaky=ok&&(p.m.unsure||p.m.hint), box=$("#ansBox");
  if(ok){
    var today=V().today, before=S().log.some(function(e){return e.card===c.id&&!e.ok&&e.d<today;});
    var msg=shaky?"答對了！你有勾「不太確定」或用了提示，明天再確認一次。":info.graduated?"答對了！這張卡在 3 個不同的日子都答對，畢業了。":info.variation?"答對了！換了題目也會，觀念弄懂了。":before?"答對了！上次卡住的這題，這次你自己答對了。":"答對了！";
    if(!shaky) chime();
    if(!p.selfGraded) box.insertAdjacentHTML("beforeend",'<div class="fb ok"><strong>'+esc(msg)+'</strong><span>'+esc(c.why||"")+'</span>'+(c.type==="figure"?figureSvg(c.fig,true):"")+srcLine(c)+'</div>');
    else box.insertAdjacentHTML("beforeend",'<div class="fb ok"><strong>'+esc(msg)+'</strong></div>');
    box.insertAdjacentHTML("beforeend",'<div class="row"><button class="btn" id="next" type="button">下一題</button></div>');
    on("#next",renderPractice); $("#next").focus();
    return;
  }
  if(info.halted||(!p.ok&&p.a&&p.a.variation&&S().session&&S().session.halted)) return renderHalted(c,p.selfGraded);
  if(!p.selfGraded&&c.type!=="map") box.insertAdjacentHTML("beforeend",'<div class="fb no"><strong>正確答案是「'+esc(answerText(c))+'」</strong><span>'+esc(c.why||"")+'</span>'+(c.type==="figure"?figureSvg(c.fig,true):"")+srcLine(c)+'</div>');
  if(c.type==="map") box.insertAdjacentHTML("beforeend",'<div class="fb no"><span>'+esc(c.why||"")+'</span></div>');
  box.insertAdjacentHTML("beforeend",'<div class="fb" id="errq" style="background:var(--bg)"><strong>你覺得錯在哪裡？<span class="muted" style="font-weight:400">（自己選，沒有標準答案）</span></strong><div class="chips">'+
    Object.keys(ERRS).map(function(k){return '<button class="chip'+(k==="concept"?' pri':'')+'" type="button" data-k="'+k+'">'+ERRS[k]+'</button>';}).join("")+'<button class="chip" type="button" data-k="">先跳過</button></div></div>');
  $("#errq").querySelectorAll("button").forEach(function(b){b.onclick=function(){
    $("#errq").querySelectorAll("button").forEach(function(x){x.disabled=true;});
    b.classList.add("picked");
    var k=b.dataset.k;
    if(k==="concept") return remedy(c);
    var tip={reading:"下次先把題目的關鍵字圈起來，再看選項。",slip:"知道答案很棒！下次選之前再對一次題目。","":"沒關係，這張卡明天會再出現。"}[k];
    box.insertAdjacentHTML("beforeend",'<div class="fb ok"><span>'+esc(tip)+'</span><div class="row"><button class="btn" type="button" id="next">下一題</button></div></div>');
    on("#next",renderPractice); $("#next").focus();
  };});
}

/* 1-3 季節：選夏至／春分／秋分／冬至，看台中真實的日出方向、白天長短、正午高度與影子（sun.js 約略計算） */
LABS.season=function(box){
  var DAYS=[["夏至","6/21",new Date(2026,5,21)],["春分","3/20",new Date(2026,2,20)],["秋分","9/23",new Date(2026,8,23)],["冬至","12/21",new Date(2026,11,21)]];

      '<text x="296" y="140" font-size="15" fill="var(--ink)">東</text><text x="54" y="140" text-anchor="end" font-size="15" fill="var(--ink)">西</text>'+

  function tasks(){

/* 3-1 溶解：重量由物質帳本算，溶解按經過時間（與幀率、減少動態效果無關） */
LABS.dissolve=function(box){
  box.innerHTML='<svg class="labsvg" viewBox="0 0 360 240" id="dsSvg"></svg><div class="row"><button class="btn sm" type="button" id="dsGo">放入方糖（10 g）</button><label class="toggle small"><input type="checkbox" id="dsStir"> 攪拌</label><label class="toggle small"><input type="checkbox" id="dsHot"> 熱水</label><button class="btn sun sm" type="button" id="dsSalt">加一匙鹽（6 g）</button><button class="btn ghost sm" type="button" id="dsNew">換一杯清水</button></div><div class="readout" id="dsRo">按「放入方糖」開始。溶解快慢是示意，不是真實測量。</div>';
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var m=C.dissolveNew(), P=[], sugarStart=null, coldStir=null, hotStir=null, mixed=false;
  function now(){return performance.now();}
  function sync(){m=C.dissolveStep(m,now());}
  function draw(){
    var r=C.dissolveRead(m);
    var s='<rect x="90" y="60" width="180" height="160" rx="10" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="92" y="78" width="176" height="140" fill="var(--waterfill)" opacity=".7"/>';
    if(r.sugarSolid>0){var w=26*Math.sqrt(r.sugarSolid/10);s+='<rect x="'+(180-w/2).toFixed(1)+'" y="'+(214-w).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+w.toFixed(1)+'" fill="#fff" stroke="var(--muted)"/>';}
    if(!reduce) P.forEach(function(p){s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="1.6" fill="var(--ink)" opacity=".45"/>';});
    else if(r.sugarDissolved>0||r.saltDissolved>0) s+='<text x="180" y="150" text-anchor="middle" font-size="13" fill="var(--ink)">（溶解的粒子小到看不見）</text>';
    for(var i=0;i<Math.round(r.saltSolid);i++) s+='<rect x="'+(110+(i*13)%140)+'" y="'+(210-Math.floor(i/11)*4)+'" width="5" height="4" fill="#fff" stroke="var(--muted)"/>';
    s+='<rect x="292" y="150" width="60" height="70" rx="6" fill="var(--card)" stroke="var(--line)"/><text x="322" y="190" text-anchor="middle" font-size="16" fill="var(--ink)">'+r.scaleMass+' g</text><text x="322" y="210" text-anchor="middle" font-size="11" fill="var(--muted)">秤</text>';
    $("#dsSvg").innerHTML=s;
  }
  function tick(){
    sync(); var r=C.dissolveRead(m);
    if(!reduce){var rate=(m.hot?2:1)*(m.stir?2:1);if(r.sugarSolid>0)for(var i=0;i<rate;i++)if(P.length<260)P.push({x:180+(Math.random()-.5)*20,y:200,vx:(Math.random()-.5)*(m.stir?3:1),vy:-Math.random()*(m.stir?2.5:1)});
      P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<95||p.x>265)p.vx*=-1;if(p.y<80||p.y>212)p.vy*=-1;p.vx+=(Math.random()-.5)*.3;p.vy+=(Math.random()-.5)*.3;});}
    draw();
    if(r.sugarTotal>0&&r.sugarSolid===0&&m.sugarDoneAt!==null&&sugarStart!==null){
      var sec=((m.sugarDoneAt-sugarStart)/1000).toFixed(1), label=(m.hot?"熱水":"冷水")+(m.stir?"＋攪拌":"");
      var weigh='<br>秤重：杯子＋水 '+m.base+' g、糖 '+r.sugarTotal+' g；溶解後一起秤 <b>'+r.scaleMass+' g</b>，重量一樣。';
      if(mixed) $("#dsRo").innerHTML='方糖溶完了，糖還在水裡。這次溶到一半換了條件，不能拿來比冷水和熱水；按「換一杯清水」再各做一次。'+weigh;
      else{ if(!m.hot) coldStir=m.stir; else hotStir=m.stir;
        var fair=coldStir!==null&&hotStir!==null&&coldStir===hotStir, unfair=coldStir!==null&&hotStir!==null&&coldStir!==hotStir;
        $("#dsRo").innerHTML='方糖不見了，可是糖還在水裡（分散成看不見的小粒子）。'+label+'：花了 '+sec+' 秒（示意）。'+weigh+
          (unfair?'<br><b>注意：</b>冷水和熱水那兩杯的攪拌方式不一樣，不能比較快慢。比較時只能改「水溫」一個條件，攪拌要一樣。':fair?'<br>冷水和熱水都用一樣的攪拌方式做過了，可以比較：熱水比較快。':''); }
      if(coldStir!==null) check(0); if(coldStir!==null&&hotStir!==null&&coldStir===hotStir) check(1); check(2);
      sugarStart=null;
    }
    if(r.sugarSolid>0||(!reduce&&P.length)) labTimer=requestAnimationFrame(tick); else labTimer=null;
  }
  function start(){if(!labTimer) labTimer=requestAnimationFrame(tick);}
  on("#dsGo",function(){sync();if(C.dissolveRead(m).sugarSolid>0){$("#dsRo").textContent="上一顆方糖還在溶解，等它溶完再放。";return;}
    m=C.dissolveAddSugar(m,now()); sugarStart=now(); mixed=false; $("#dsRo").textContent="糖正在溶解……"; start();});
  function changed(){if(sugarStart!==null&&C.dissolveRead(m).sugarSolid>0) mixed=true;}
  $("#dsStir").onchange=function(e){sync();changed();m.stir=e.target.checked;};
  $("#dsHot").onchange=function(e){sync();changed();m.hot=e.target.checked;};
  on("#dsSalt",function(){sync();m=C.dissolveAddSalt(m);var r=C.dissolveRead(m);
    if(!reduce&&r.saltSolid===0)for(var i=0;i<20;i++)P.push({x:180+(Math.random()-.5)*60,y:90+Math.random()*120,vx:(Math.random()-.5),vy:(Math.random()-.5)});

    if(r.saltSolid>0) check(3); draw(); start();});
  // 換一杯清水：已做過的冷水／熱水紀錄保留，換杯是為了做下一杯
  on("#dsNew",function(){stopAnim();m=C.dissolveNew();m.hot=$("#dsHot").checked;m.stir=$("#dsStir").checked;P=[];sugarStart=null;mixed=false;draw();$("#dsRo").textContent="換了一杯清水：秤 "+m.base+" g。";});
  draw();
};

function renderExit(){
  var list=C.exitList(S(),{bank:BANK,now:Date.now()}), el=$("#exitList");
  if(!list.length){el.innerHTML='<p class="muted" style="margin:0">練過的觀念會出現在這裡。隔天不看提示、用說的或寫在紙上回答，答得出來才算真的學會。</p>';return;}
  var ready=list.filter(function(x){return x.ready;}), later=list.filter(function(x){return !x.ready&&x.status!=="pass";}), passed=list.filter(function(x){return x.status==="pass";});
  var h='<p class="small muted" style="margin:0 0 10px">不給提示、不給選項，請她用說的或寫在紙上。這些題目在練習裡沒出現過。答得出來，植物就會開花。</p>';
  if(ready.length) h+='<ol class="exits">'+ready.map(function(x){var c=CONCEPTS[x.cid];
    return '<li><div><strong>'+esc(c.title)+'</strong>'+(x.status==="fail"?' <span class="small muted">上次（'+md(x.last)+'）還不行，再問一次</span>':'')+'</div><div>'+esc(c.exit)+'</div>'+
      '<details><summary>參考答案</summary><div class="small">'+esc(c.exitAns)+'</div></details>'+
      '<div class="row" style="margin-top:6px"><button class="btn ghost sm" type="button" data-c="'+x.cid+'" data-r="pass">答得出來</button><button class="btn ghost sm" type="button" data-c="'+x.cid+'" data-r="fail">還不行</button></div></li>';}).join("")+'</ol>';
  else h+='<p style="margin:0">今天沒有要問的出口題。</p>';
  if(later.length) h+='<p class="small muted">明天以後再問：'+later.map(function(x){return esc(CONCEPTS[x.cid].short)+'（'+md(x.due)+'）';}).join("、")+'</p>';
  if(passed.length) h+='<div class="small" style="display:grid;gap:6px">'+passed.map(function(x){return '<div class="row">已答得出來：'+esc(CONCEPTS[x.cid].short)+'（'+md(x.last)+'）<button class="btn ghost sm" type="button" data-retest="'+x.cid+'">再考一次</button></div>';}).join("")+'</div>';
  el.innerHTML=h;
  el.querySelectorAll("button[data-c]").forEach(function(b){b.onclick=function(){act({type:"exit",cid:b.dataset.c,result:b.dataset.r});renderSide();renderConcepts();};});
  el.querySelectorAll("button[data-retest]").forEach(function(b){b.onclick=function(){act({type:"exitRetest",cid:b.dataset.retest});renderSide();};});
}

/* ---------- 家長摘要：只留三個數 ---------- */
function renderSummary(){
  var v=V(), cp=v.M.cardProgress;
  var lines=["五上自然複習 "+md(v.today)+"（距考試 "+Math.max(0,C.diffDays(v.today,EXAM))+" 天）",
    "今天卡片："+(cp.planned?cp.done+" / "+cp.planned+" 張"+(v.completed?"（完成）":""):"今天沒有排定卡片"),
    "出口題待辦："+v.M.exitPending+" 題"+(v.exitLater?"（另有 "+v.exitLater+" 題明天以後再問）":""),
    "今天加碼："+(v.M.extraDone?"有（做完卡片後又自己多做）":"還沒有")];
  if(v.needsHelp.length) lines.push("需要爸媽陪著看："+v.needsHelp.map(function(c){return CONCEPTS[c].short;}).join("、"));
  $("#summary").innerHTML='<div style="display:grid;gap:14px"><div class="three"><div><span class="small muted">今天卡片</span><b>'+cp.done+' / '+cp.planned+'</b></div><div><span class="small muted">出口題待辦</span><b>'+v.M.exitPending+'</b></div><div><span class="small muted">今天加碼</span><b>'+(v.M.extraDone?"有":"還沒")+'</b></div></div>'+
    (v.needsHelp.length?'<div class="banner info"><strong>需要爸媽陪著看：'+v.needsHelp.map(function(c){return esc(CONCEPTS[c].short);}).join("、")+'</strong><div class="row">'+v.needsHelp.map(function(c){return '<button class="btn ghost sm" type="button" data-helped="'+c+'">已經陪她看過「'+esc(CONCEPTS[c].short)+'」</button>';}).join("")+'</div></div>':'')+
    '<pre id="sumText" style="white-space:pre-wrap;margin:0;font-family:var(--f-body)">'+esc(lines.join("\n"))+'</pre>'+
    '<div class="row"><button class="btn ghost sm" id="copySum" type="button">複製摘要（貼到 LINE）</button><span class="small muted" id="copyMsg"></span></div>'+
    '<p class="small" style="margin:0;background:var(--sun-soft);border-radius:12px;padding:10px 14px">給爸媽：請不要用「做完就給獎品」。研究（Deci, Koestner & Ryan 1999，128 個實驗）發現，事先說好的實質獎勵會降低孩子自己想做的意願；具體說出她哪裡進步（例如「上次錯的影子題，今天你自己講出原因了」）效果比較好。</p></div>';
  $("#summary").querySelectorAll("button[data-helped]").forEach(function(b){b.onclick=function(){act({type:"helped",cid:b.dataset.helped});renderSide();renderConcepts();};});
  on("#copySum",function(){
    var t=lines.join("\n");
    function done(){$("#copyMsg").textContent="已複製";}
    function fail(){var r=document.createRange();r.selectNodeContents($("#sumText"));var s=getSelection();s.removeAllRanges();s.addRange(r);$("#copyMsg").textContent="已選取文字，請按複製";}
    try{navigator.clipboard.writeText(t).then(done,fail);}catch(e){fail();}
  });
}
function renderSide(){header();banners();renderConcepts();renderCal();renderExit();renderSummary();renderSettings();}

/* ---------- 設定 ---------- */
function renderSettings(){
  var s=S(), st=store.get();
  $("#u3").checked=!!s.settings.unit3; $("#snd").checked=!!s.settings.sound;
  $("#storeMsg").textContent=st.loadError?(st.loadError==="SCHEMA"?"存檔讀不出來，目前不會存檔。":st.loadError==="MIGRATE"?"舊紀錄搬不過來，目前不會存檔（舊紀錄還在）。":"讀不到這台裝置的紀錄，目前不會存檔。"):memoryOnly?"這台裝置存不了作答紀錄。":"作答紀錄只存在這台裝置的瀏覽器（不上傳）。"+(st.migrated?"已把舊版紀錄搬過來；舊版的「畢業」要重新確認一次。":"");
  var rr=$("#resetRow");
  if(st.loadError==="READ"){rr.innerHTML="";return;}
  if(st.loadError){rr.innerHTML='<button class="btn warn sm" id="discard" type="button">'+(st.loadError==="MIGRATE"?'略過舊紀錄，從頭開始（舊紀錄保留在這台裝置）':'清除壞掉的存檔，重新開始')+'</button>';on("#discard",function(){rr.innerHTML='<span>確定要清除？舊存檔會被覆蓋。</span><button class="btn warn sm" id="discardYes" type="button">清除</button><button class="btn ghost sm" id="discardNo" type="button">取消</button>';on("#discardNo",renderSettings);on("#discardYes",function(){store.discardBroken();renderHome();});});return;}
  if(!rr.dataset.state){rr.innerHTML='<button class="btn ghost sm" id="resetBtn" type="button">清除全部作答紀錄</button>';
    on("#resetBtn",function(){rr.dataset.state="ask";rr.innerHTML='<span>確定要清除所有作答紀錄？</span><button class="btn warn sm" id="resetYes" type="button">清除</button><button class="btn ghost sm" id="resetNo" type="button">取消</button>';
      on("#resetNo",function(){delete rr.dataset.state;renderSettings();});
      on("#resetYes",function(){delete rr.dataset.state;act({type:"reset"});renderHome();});});}
}
$("#u3").onchange=function(e){act({type:"settings",unit3:e.target.checked});renderSide();};
$("#snd").onchange=function(e){act({type:"settings",sound:e.target.checked});};
on("#importBtn",function(){
  var msg=$("#importMsg");
  try{
    var arr=JSON.parse($("#importBox").value);
    if(!Array.isArray(arr)) throw new Error("最外層要是 [ … ]");
    var r=act({type:"import",cards:arr});
    if(!r.ok){msg.textContent="沒有存到，請再按一次加入。";return;}
    msg.textContent="加入 "+r.info.acceptedIds.length+" 張（明天開始出）"+(r.info.rejectedIds.length?"，略過 "+r.info.rejectedIds.length+" 張（重複、缺欄位、答案編號或圖片代號不對）":"");
    if(r.info.acceptedIds.length)$("#importBox").value="";
  }catch(e){msg.textContent="格式不對："+e.message;}
});

/* ---------- 啟動與跨午夜 ---------- */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible") return;
  var changed=V().today!==shownDay; act({type:"tick"});
  if(changed){ if(screen==="practice") route(); else renderHome(); renderSide(); }
  else if(screen==="home") renderHome();
  else renderSide();
});
renderHome();
})();
</script>
</body></html>
